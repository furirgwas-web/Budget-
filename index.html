        const cat = { id:rid(), name:"Погашення: " + name, icon: ty === "credit" ? "💳" : "🧾", pay:a.id };
        if (plan === "monthly"){ const pa = parseAmt(q(el,"#aPlanAmt").value); if (!pa || isNaN(pa) || pa <= 0) return toast("Введіть щомісячну суму"); cat.target = { type:"monthly", amt:pa }; }
        if (plan === "date") cat.target = { type:"date", amt:1, month: q(el,"#aPlanMonth").value || addMonth(curMonth(), 3) };
        let g = S.meta.groups.find(x => x.debts);
        if (!g){ g = { id:rid(), name:"Борги", cats:[], debts:true }; S.meta.groups.unshift(g); }
        g.cats.push(cat); a.payCat = cat.id;
        S.meta.accounts.push(a); markDirty("meta");
        if (bal) putTx({ id:rid(), ts:Date.now(), date:todayStr(), amt:-bal, acc:a.id, cat:null, payee:"Початковий борг", memo:"", sys:"start" });
      } else {
        if (q(el,"#aNeg").checked) bal = -bal;
        S.meta.accounts.push(a); markDirty("meta");
        if (bal) putTx({ id:rid(), ts:Date.now(), date:todayStr(), amt:bal, acc:a.id, cat:"rta", payee:"Початковий баланс", memo:"", sys:"start" });
      }
      closeSheet(); refresh(); toast(d ? "Борг додано" : "Рахунок додано");
    };
  });
}
function accSheet(id){
  const a = accById(id), bal = accBalance(id), d = !!(a.payCat && catById(a.payCat));
  const p = d ? compute(curMonth()).per[a.payCat] : null;
  openSheet(a.name, `
    <div class="card" style="text-align:center"><div class="muted" style="font-size:12.5px">${d ? "Борг зараз" : "Залишок за записами"}</div><div class="big num"${(d ? bal < 0 : bal < 0) ? ' style="color:var(--neg)"' : ""}>${eur(d ? -bal : bal)}</div>${d ? '<div class="muted" style="font-size:13px;margin-top:4px">Відкладено на погашення: <span class="num">' + eur(p.available) + '</span></div>' : ""}</div>
    ${d && !a.closed ? '<div class="row" style="margin-bottom:14px"><button class="btn" id="aPay">Внести платіж</button><button class="btn sec" id="aBuy">Покупка в борг</button></div>' : ""}
    <div class="f"><label>${d ? "Звірити: скільки ви винні за даними кредитора, €" : "Звірити: фактичний залишок у банку, €"}</label><div class="row"><input type="text" id="rBal" inputmode="decimal" placeholder="${amtStr(Math.abs(bal)) || "0,00"}"><button class="btn" style="flex:none" id="rOk">Звірити</button></div></div>
    ${d ? "" : '<label class="chk"><input type="checkbox" id="rNeg"' + (bal < 0 ? " checked" : "") + '><span>Залишок у мінусі</span></label>'}
    <button class="btn sec wide" id="aTx">☰ Транзакції рахунку</button>
    <div class="sep"></div>
    <div class="f"><label>Назва</label><input type="text" id="aName" value="${esc(a.name)}" maxlength="40"></div>
    ${d ? "" : '<div class="f"><label>Тип</label><select id="aType">' + Object.entries(ACC_TYPES).filter(([k]) => k !== "debt").map(([k, l]) => '<option value="' + k + '"' + (k === a.type ? " selected" : "") + '>' + l + '</option>').join("") + '</select></div>'}
    <div class="row"><button class="btn sec" id="aSave">Зберегти</button><button class="btn ${a.closed ? "sec" : "danger"}" id="aClose">${a.closed ? "Відкрити знову" : "Закрити рахунок"}</button></div>`, el => {
    q(el,"#rOk").onclick = () => {
      let real = parseAmt(q(el,"#rBal").value); if (isNaN(real)) return toast("Введіть суму");
      real = Math.abs(real); if (d || q(el,"#rNeg").checked) real = -real;
      const diff = real - bal;
      if (!diff){ closeSheet(); return toast("Усе збігається ✓"); }
      putTx(d ? { id:rid(), ts:Date.now(), date:todayStr(), amt:diff, acc:id, cat:null, payee:"Коригування боргу", memo:"", sys:"adj" }
              : { id:rid(), ts:Date.now(), date:todayStr(), amt:diff, acc:id, cat:"rta", payee:"Коригування при звірці", memo:"", sys:"adj" });
      closeSheet(); refresh(); toast("Додано коригування " + eur(diff));
    };
    if (q(el,"#aPay")){ q(el,"#aPay").onclick = () => payDebt(id); q(el,"#aBuy").onclick = () => txSheet(null, { kind:"out", acc:id }); }
    q(el,"#aTx").onclick = () => { closeSheet(); S.accFilter = id; S.catFilter = ""; S.tab = "tx"; refresh(); };
    q(el,"#aSave").onclick = () => {
      const nn = q(el,"#aName").value.trim() || a.name, pcat = d ? catById(a.payCat) : null;
      if (pcat && pcat.name === "Погашення: " + a.name) pcat.name = "Погашення: " + nn;
      a.name = nn; if (!d) a.type = q(el,"#aType").value;
      markDirty("meta"); closeSheet(); refresh();
    };
    q(el,"#aClose").onclick = () => {
      if (!a.closed && bal) return toast(d ? "Спочатку погасіть борг до 0 €" : "Спочатку переведіть залишок на інший рахунок (до 0 €)");
      a.closed = !a.closed;
      if (d) catById(a.payCat).hidden = a.closed;
      markDirty("meta"); closeSheet(); refresh();
    };
  });
}

/* ---------- Einstellungen / Sicherung ---------- */
let dlP = null;
const getDl = () => dlP || (dlP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null));
function settingsSheet(){
  openSheet("Налаштування", `
    <div class="f"><label>Дизайн</label><div class="seg" id="sTheme"><button data-v="apple"${S.meta.theme === "neo" ? "" : ' class="on"'}>Apple</button><button data-v="neo"${S.meta.theme === "neo" ? ' class="on"' : ""}>Темний необанк</button></div></div>
    <div class="help card" style="background:var(--soft);border:0">
      <p><b>Готово до розподілу</b>: гроші, які ще не отримали завдання. Мета — 0 €.</p>
      <p><b>Розподілено</b>: скільки цього місяця виділено на категорію. <b>Доступно</b>: скільки ще можна витратити (залишки переходять на наступний місяць).</p>
      <p>Якщо витратили більше, ніж було (червоний залишок), перемістіть гроші з іншої категорії. Інакше наступного місяця нестача спише гроші з «Готово до розподілу».</p>
      <p>Дохід записуйте як «Дохід» → «Готово до розподілу».</p>
      <p><b>Борги</b> (Klarna, розстрочка, кредит) додавайте у вкладці «Рахунки» → «Борг». Борг не зменшує «Готово до розподілу»: ви відкладаєте гроші в категорію «Погашення», а потім вносите платіж. Покупка в борг одразу зменшує свою категорію.</p>
      <p><b>Регулярні платежі</b> (оренда, зарплата, підписки): у новій транзакції виберіть «Повторювати», і програма записуватиме їх сама.</p>
    </div>
    <button class="btn sec wide" id="sExp">⬇ Експорт резервної копії (JSON)</button>
    <label class="btn sec wide" style="display:block;text-align:center;margin-top:8px">⬆ Імпорт з резервної копії<input type="file" id="sImp" accept="application/json,.json" hidden></label>
    <button class="btn sec wide" style="margin-top:8px" id="sCsv">⬇ Транзакції у CSV (для Excel)</button>
    <div class="sep"></div>
    <button class="btn danger wide" id="sReset">Видалити всі дані</button>
    <p class="muted" style="font-size:12px;margin-top:10px">${store.kind === "db" ? "Дані зберігаються у вашому приватному сховищі й синхронізуються між пристроями. Інші люди їх не бачать." : "Дані зберігаються лише в цьому браузері. Регулярно робіть резервну копію."}</p>`, el => {
    const save = async (name, data) => {
      const dl = await getDl();
      if (dl){ try { await dl.save({ filename:name, data }); toast("Збережено"); } catch(e){ toast(e && e.code === "declined" ? "Скасовано" : "Не вдалося зберегти файл"); } }
      else { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data])); a.download = name; a.click(); }
    };
    segBind(q(el,"#sTheme"), v => { if (v === "neo") S.meta.theme = "neo"; else delete S.meta.theme; markDirty("meta"); refresh(); });
    q(el,"#sExp").onclick = () => save("budget-backup-" + todayStr() + ".json", JSON.stringify({ app:"my-budget", v:1, exported:new Date().toISOString(), meta:S.meta, tx:S.tx }, null, 1));
    q(el,"#sCsv").onclick = () => {
      const rows = [["Дата","Рахунок","Одержувач","Категорія","Нотатка","Сума"]];
      allTx().sort((a, b) => a.date < b.date ? -1 : 1).forEach(t => rows.push([t.date, (accById(t.acc)||{}).name || "", t.to ? "Переказ → " + ((accById(t.to)||{}).name || "") : t.payee || "", t.cat === "rta" ? "Готово до розподілу" : t.cat ? (catById(t.cat)||{}).name || "" : "", t.memo || "", (t.amt/100).toFixed(2).replace(".", ",")]));
      save("transactions-" + todayStr() + ".csv", "﻿" + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(";")).join("\r\n"));
    };
    q(el,"#sImp").onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const o = JSON.parse(await f.text());
        if (!o.meta || !o.tx || !Array.isArray(o.meta.groups)) throw 0;
        confirmSheet("Замінити всі поточні дані даними з файлу «" + f.name + "»?", "Замінити", () => {
          Object.keys(S.tx).forEach(k => { if (!o.tx[k]) { S.tx[k] = []; markDirty(k); } });
          S.meta = normMeta(o.meta); markDirty("meta");
          Object.keys(o.tx).forEach(k => { S.tx[k] = o.tx[k]; markDirty(k); });
          refresh(); toast("Імпортовано");
        });
      } catch(_){ toast("Файл не схожий на резервну копію цього застосунку"); }
    };
    q(el,"#sReset").onclick = () => confirmSheet("Видалити всі рахунки, категорії й транзакції без можливості відновлення?", "Видалити все", () => {
      Object.keys(S.tx).forEach(k => { S.tx[k] = []; markDirty(k); });
      S.meta = null;
      if (store.kind === "db") (async () => { while (saving) await new Promise(r => setTimeout(r, 100)); try { await store.metaRef.delete(); } catch(_){} })();
      else { try { localStorage.removeItem(LS_KEY); } catch(_){} }
      refresh();
    });
  });
}

/* ---------- Ziele automatisch füllen ---------- */
function autoAssign(){
  const C = compute(S.month); let left = C.rta, total = 0;
  for (const c of allCats()){
    if (c.hidden) continue;
    const p = C.per[c.id]; if (p.under <= 0 || left <= 0) continue;
    const add = Math.min(p.under, left);
    setAssigned(S.month, c.id, p.assigned + add); left -= add; total += add;
  }
  refresh(); toast("Розподілено " + eur(total));
}

/* =====================================================================
   Ereignisse
   ===================================================================== */
function moveCat(id, dir){
  const flat = []; S.meta.groups.forEach(g => g.cats.forEach(c => flat.push([g, c])));
  const i = flat.findIndex(([, c]) => c.id === id); if (i < 0) return;
  const [g, c] = flat[i], idx = g.cats.indexOf(c);
  if (dir < 0){
    if (idx > 0) [g.cats[idx-1], g.cats[idx]] = [g.cats[idx], g.cats[idx-1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi > 0){ g.cats.splice(idx, 1); S.meta.groups[gi-1].cats.push(c); } }
  } else {
    if (idx < g.cats.length - 1) [g.cats[idx+1], g.cats[idx]] = [g.cats[idx], g.cats[idx+1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi < S.meta.groups.length - 1){ g.cats.splice(idx, 1); S.meta.groups[gi+1].cats.unshift(c); } }
  }
  markDirty("meta"); refresh();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.closest(".ov")) return;
  const id = el.dataset.id, act = el.dataset.act;
  if (act === "catUp" || act === "catDown"){ e.stopPropagation(); return moveCat(id, act === "catUp" ? -1 : 1); }
  switch (act){
    case "mPrev": S.month = addMonth(S.month, -1); refresh(); break;
    case "mNext": S.month = addMonth(S.month, 1); refresh(); break;
    case "settings": settingsSheet(); break;
    case "toggleGrp": S.collapsed[id] = !S.collapsed[id]; refresh(); break;
    case "toggleEdit": S.edit = !S.edit; refresh(); break;
    case "openCat": catSheet(id); break;
    case "editCat": editCatSheet(id); break;
    case "autoAssign": autoAssign(); break;
    case "addCat": nameSheet("Нова категорія", "", v => { S.meta.groups.find(g => g.id === id).cats.push({ id:rid(), name:v }); markDirty("meta"); refresh(); }); break;
    case "addGroup": nameSheet("Нова група", "", v => { S.meta.groups.push({ id:rid(), name:v, cats:[] }); markDirty("meta"); refresh(); }); break;
    case "renameGroup": { const g = S.meta.groups.find(x => x.id === id);
      nameSheet("Група", g.name, v => { g.name = v; markDirty("meta"); refresh(); },
        { label:"Видалити групу", fn: () => { if (g.cats.length) return toast("Спочатку перенесіть або видаліть категорії групи"); S.meta.groups.splice(S.meta.groups.indexOf(g), 1); markDirty("meta"); refresh(); } }); break; }
    case "grpUp": case "grpDown": { e.stopPropagation(); const gs = S.meta.groups, i = gs.findIndex(g => g.id === id), j = i + (act === "grpUp" ? -1 : 1);
      if (j >= 0 && j < gs.length){ [gs[i], gs[j]] = [gs[j], gs[i]]; markDirty("meta"); refresh(); } break; }
    case "editTx": txSheet(id); break;
    case "clearCatFilter": S.catFilter = ""; refresh(); break;
    case "showUncat": S.catFilter = "__none"; S.tab = "tx"; refresh(); break;
    case "more": S.txLimit += 150; refresh(); break;
    case "openAcc": accSheet(id); break;
    case "addAcc": addAccSheet(); break;
    case "addTx": txSheet(null); break;
    case "xferTx": txSheet(null, { kind:"xfer" }); break;
    case "txAll": S.accFilter = ""; S.catFilter = ""; S.tab = "tx"; refresh(); break;
    case "moveAny": moveAnySheet(); break;
    case "sched": schedSheet(); break;
    case "editSched": txSheet(null, null, id); break;
    case "addDebt": addAccSheet("debt"); break;
    case "newGoal": goalSheet(); break;
  }
});
document.querySelectorAll(".nav button[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab !== "tx"){ S.catFilter = ""; } window.scrollTo(0, 0); refresh(); });
$("navAdd").onclick = () => txSheet(null, S.tab === "tx" && S.catFilter && S.catFilter !== "__none" ? { cat:S.catFilter } : S.tab === "tx" && S.accFilter ? { acc:S.accFilter } : null);
window.addEventListener("pagehide", () => { if (dirty.size) flush(); });

init();
})();
</script>
</body>
