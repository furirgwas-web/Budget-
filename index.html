}

/* ---------- Ziele automatisch füllen ---------- */
function autoAssign(){
  const C = compute(S.month); let left = C.rta, total = 0;
  for (const c of allCats()){
    if (c.hidden) continue;
    const p = C.per[c.id]; if (p.under <= 0 || left <= 0) continue;
    const add = Math.min(p.under, left);
    setAssigned(S.month, c.id, p.assigned + add); left -= add; total += add;
  }
  note("Розподілено за цілями: " + eur(total)); refresh(); toast("Розподілено " + eur(total));
}
function avgSpent(m, n){             // середні витрати за категоріями за n місяців перед m (з історією; лише місяці, де були дані)
  const want = new Set(); for (let k = 1; k <= n; k++) want.add(addMonth(m, -k));
  const sum = {}, seen = new Set();
  for (const t of allTx()){
    const tm = t.date.slice(0, 7); if (!want.has(tm) || t.sys) continue; seen.add(tm);
    if (t.to || !t.cat || t.cat === "rta" || t.amt >= 0) continue; sum[t.cat] = (sum[t.cat] || 0) - t.amt;
  }
  const avg = {}; if (seen.size) for (const c in sum) avg[c] = Math.round(sum[c] / seen.size / 100) * 100;
  return { avg, months:[...seen].sort() };
}
function fillSheet(){
  const C = compute(S.month), prevA = S.meta.assigned[addMonth(S.month, -1)] || {}, curA = S.meta.assigned[S.month] || {};
  const vis = allCats().filter(c => !c.hidden), free = Math.max(0, C.rta);
  let under = 0, prevSum = 0, curSum = 0;
  vis.forEach(c => { under += C.per[c.id].under; if (!curA[c.id] && prevA[c.id] > 0) prevSum += prevA[c.id]; });
  for (const k in curA) curSum += curA[k];
  const AV = avgSpent(S.month, 3), avgNeed = {}; let avgSum = 0;       // скільки зазвичай витрачаєте: доповнити категорії до цього рівня
  vis.forEach(c => { if (c.pay) return; const need = Math.max(0, (AV.avg[c.id] || 0) - Math.max(0, C.per[c.id].start) - (curA[c.id] || 0)); if (need > 0){ avgNeed[c.id] = need; avgSum += need; } });
  openSheet("Заповнити бюджет", `
    <div class="card" style="text-align:center"><div class="muted" style="font-size:12.5px">Готово до розподілу</div><div class="big num"${C.rta < 0 ? ' style="color:var(--neg)"' : ""}>${eur(C.rta)}</div></div>
    <button class="btn wide" id="fGoals"${under > 0 && free > 0 ? "" : " disabled"}>За цілями і планами боргів: ${eur(Math.min(under, free))}</button>
    <button class="btn sec wide" style="margin-top:8px" id="fPrev"${prevSum > 0 && free > 0 ? "" : " disabled"}>Як минулого місяця: ${eur(Math.min(prevSum, free))}</button>
    <button class="btn sec wide" style="margin-top:8px" id="fAvg"${avgSum > 0 && free > 0 ? "" : " disabled"}>За середніми витратами${AV.months.length ? " (" + AV.months.length + " міс.)" : ""}: ${eur(Math.min(avgSum, free))}</button>
    <button class="btn danger wide" style="margin-top:8px" id="fReset"${curSum ? "" : " disabled"}>Скинути розподіл цього місяця: ${eur(curSum)}</button>
    <p class="muted" style="font-size:12.5px;margin:12px 2px 0">${free > 0 ? "Розподіляється лише те, що є в «Готово до розподілу»." : "Зараз немає вільних грошей для розподілу: спершу запишіть дохід або звірте залишок рахунку."} Будь-яку дію можна скасувати кнопкою ↩︎ угорі.</p>`, el => {
    q(el,"#fGoals").onclick = () => { closeSheet(); autoAssign(); };
    q(el,"#fAvg").onclick = () => {
      let left = free, total = 0;
      for (const c of vis){ const need = avgNeed[c.id] || 0; if (need <= 0 || left <= 0) continue; const add = Math.min(need, left); setAssigned(S.month, c.id, (curA[c.id] || 0) + add); left -= add; total += add; }
      note("Сплановано за середніми витратами: " + eur(total)); closeSheet(); refresh();
      toast("Розподілено " + eur(total) + (avgSum > total ? " · бракує " + eur(avgSum - total) : ""));
    };
    q(el,"#fPrev").onclick = () => {
      let left = free, total = 0;
      for (const c of vis){ const a = prevA[c.id] || 0; if (curA[c.id] || a <= 0 || left <= 0) continue; const add = Math.min(a, left); setAssigned(S.month, c.id, add); left -= add; total += add; }
      note("Розподілено як минулого місяця: " + eur(total)); closeSheet(); refresh(); toast("Розподілено " + eur(total));
    };
    q(el,"#fReset").onclick = () => confirmSheet("Прибрати всі розподіли за " + monthLabel(S.month).toLowerCase() + "? Гроші повернуться в «Готово до розподілу».", "Скинути", () => {
      delete S.meta.assigned[S.month]; markDirty("meta"); note("Скинуто розподіл за " + monthLabel(S.month).toLowerCase()); refresh(); toast("Розподіл скинуто");
    });
  });
}

/* Hinweis auf den nächsten sinnvollen Schritt (höchstens einer) */
function nextStep(C){
  const tip = (cls, text, act, label, id) => '<div class="tip ' + cls + '"><div class="tt">' + text + '</div><button class="btn small" data-act="' + act + '"' + (id ? ' data-id="' + id + '"' : "") + '>' + label + '</button></div>';
  const cashAccs = S.meta.accounts.filter(a => !a.closed && !(a.payCat && catById(a.payCat)));
  if (cashAccs.length && !allTx().some(t => !t.hist && cashAccs.some(a => a.id === t.acc || a.id === t.to)))
    return tip("", "<b>Почніть із залишку.</b> Вкажіть, скільки грошей зараз на рахунку «" + esc(cashAccs[0].name) + "»: після цього їх можна розподіляти.", "openAcc", "Ввести", cashAccs[0].id);
  if (C.rta < 0){
    if (allCats().some(c => !c.hidden && C.per[c.id].available > 0)) return tip("neg", "<b>Розподілено на " + eur(-C.rta) + " більше, ніж є.</b> Заберіть цю суму з якоїсь категорії.", "fixRta", "Виправити");
    return '<div class="tip neg"><div class="tt"><b>У «Готово до розподілу» мінус ' + eur(-C.rta) + '.</b> Грошей на рахунках менше, ніж уже витрачено: наступний дохід спершу покриє цю суму.</div></div>';
  }
  if (S.month === curMonth()){
    const done = S.meta.accounts.find(a => !a.closed && !a.needsCheck && a.payCat && catById(a.payCat) && (catById(a.payCat).target || {}).amt && accBalance(a.id) >= 0 && allTx().some(t => t.acc === a.id || t.to === a.id));
    if (done){
      const F = debtForecast(), nx = F ? F.debts.filter(d => d.a.id !== done.id && d.owed > 0 && !d.a.needsCheck).sort((x, y) => x.owed - y.owed)[0] : null, amt = catById(done.payCat).target.amt;
      return tip("", "<b>«" + esc(done.name) + "» погашено 🎉</b> " + (nx ? "Перенесіть його " + eur(amt) + "/міс на «" + esc(nx.a.name) + "», щоб закрити й цей борг швидше." : "Цей рахунок можна закрити." + (amt ? " Боргів більше немає: відкладайте ці " + eur(amt) + "/міс у «Подушку безпеки»." : "")), "rollDebt", nx ? "Перенести" : amt ? "У подушку" : "Закрити", done.id);
    }
  }
  if (S.month > curMonth() && !Object.keys(S.meta.assigned[S.month] || {}).length && C.rta > 0 && Object.keys(avgSpent(S.month, 3).avg).length)
    return tip("", "<b>" + monthLabel(S.month) + " ще не сплановано.</b> Розподіліть гроші за вашими звичними витратами за останні місяці — потім можна підправити.", "fill", "Спланувати");
  if (S.month === curMonth()) for (const a of cashAccs){
    const f = accForecast(a.id);
    if (f.first) return tip("neg", "<b>" + shortDate(f.first.e.date) + " на «" + esc(a.name) + "» не вистачить грошей.</b> Заплановані платежі більші за залишок, найменше буде " + eur(f.low.bal) + ".", "upcoming", "Показати", a.id);
  }
  const over = allCats().filter(c => !c.hidden && C.per[c.id].available < 0);
  if (over.length) return tip("warn", "<b>Витрачено понад план: " + over.slice(0, 2).map(c => esc(c.pay ? c.name.replace(/^Погашення:\s*/, "") : c.name)).join(", ") + (over.length > 2 ? " та ще " + (over.length - 2) : "") + " (" + eur(C.over) + ").</b> Ці гроші вже віднято від «Готово до розподілу». «Покрити» обнулить ці категорії.", "coverAll", "Покрити");
  return "";
}
function backupTip(){
  if (store.kind !== "local") return "";
  const inf = localInfo(), now = Date.now(), base = inf.lastBackup || inf.first || now;
  if (now - base < 10 * 864e5 || now < (inf.snooze || 0) || allTx().length < 5) return "";
  return '<div class="tip"><div class="tt"><b>Зробіть резервну копію.</b> Дані зберігаються лише на цьому пристрої' + (inf.lastBackup ? ", остання копія була " + Math.floor((now - inf.lastBackup) / 864e5) + " дн. тому." : ".") +
    '</div><div class="tb"><button class="btn small" data-act="backupNow">Зберегти</button><button class="btn sec small" data-act="backupLater">Пізніше</button></div></div>';
}

/* =====================================================================
   Ereignisse
   ===================================================================== */
function moveCat(id, dir){
  const flat = []; S.meta.groups.forEach(g => g.cats.forEach(c => flat.push([g, c])));
  const i = flat.findIndex(([, c]) => c.id === id); if (i < 0) return;
  const [g, c] = flat[i], idx = g.cats.indexOf(c);
  if (dir < 0){
    if (idx > 0) [g.cats[idx-1], g.cats[idx]] = [g.cats[idx], g.cats[idx-1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi > 0){ g.cats.splice(idx, 1); S.meta.groups[gi-1].cats.push(c); } }
  } else {
    if (idx < g.cats.length - 1) [g.cats[idx+1], g.cats[idx]] = [g.cats[idx], g.cats[idx+1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi < S.meta.groups.length - 1){ g.cats.splice(idx, 1); S.meta.groups[gi+1].cats.unshift(c); } }
  }
  markDirty("meta"); note("Змінено порядок категорій"); refresh();
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.closest(".ov")) return;
  const id = el.dataset.id, act = el.dataset.act;
  if (act === "catUp" || act === "catDown"){ e.stopPropagation(); return moveCat(id, act === "catUp" ? -1 : 1); }
  switch (act){
    case "mPrev": S.month = addMonth(S.month, -1); refresh(); break;
    case "mNext": S.month = addMonth(S.month, 1); refresh(); break;
    case "settings": settingsSheet(); break;
    case "hideAmt": setHide(!HIDE); break;
    case "toggleGrp": S.collapsed[id] = !S.collapsed[id]; refresh(); break;
    case "toggleEdit": S.edit = !S.edit; refresh(); break;
    case "toRep": S.repP = "m"; S.tab = "rep"; window.scrollTo(0, 0); refresh(); break;
    case "triage": triageSheet(); break;
    case "openCat": catSheet(id); break;
    case "editCat": editCatSheet(id); break;
    case "fill": fillSheet(); break;
    case "history": historySheet(); break;
    case "coverAll": {      // перевитрату покрити з «Готово до розподілу»: суму, яку вже віднято, закріпити за категоріями
      const C0 = compute(S.month); let n = 0;
      allCats().forEach(c => { const p = C0.per[c.id]; if (!c.hidden && p.available < 0){ setAssigned(S.month, c.id, (p.assigned || 0) - p.available); n++; } });
      if (n){ note("Покрито перевитрату: " + n + " " + plural(n, "категорія", "категорії", "категорій")); refresh(); toast("Категорії обнулено"); }
      break;
    }
    case "fixRta": moveAnySheet({ toRta:true, amt:-compute(S.month).rta }); break;
    case "backupNow": exportBackup(); break;
    case "backupLater": localInfo({ snooze: Date.now() + 3 * 864e5 }); refresh(); break;
    case "addCat": nameSheet("Нова категорія", "", v => { S.meta.groups.find(g => g.id === id).cats.push({ id:rid(), name:v }); markDirty("meta"); note("Нова категорія «" + v + "»"); refresh(); }); break;
    case "addGroup": nameSheet("Нова група", "", v => { S.meta.groups.push({ id:rid(), name:v, cats:[] }); markDirty("meta"); note("Нова група «" + v + "»"); refresh(); }); break;
    case "renameGroup": { const g = S.meta.groups.find(x => x.id === id);
      nameSheet("Група", g.name, v => { g.name = v; markDirty("meta"); note("Перейменовано групу «" + v + "»"); refresh(); },
        { label:"Видалити групу", fn: () => { if (g.cats.length) return toast("Спочатку перенесіть або видаліть категорії групи"); S.meta.groups.splice(S.meta.groups.indexOf(g), 1); markDirty("meta"); note("Видалено групу «" + g.name + "»"); refresh(); toast("Групу видалено"); } }); break; }
    case "grpUp": case "grpDown": { e.stopPropagation(); const gs = S.meta.groups, i = gs.findIndex(g => g.id === id), j = i + (act === "grpUp" ? -1 : 1);
      if (j >= 0 && j < gs.length){ [gs[i], gs[j]] = [gs[j], gs[i]]; markDirty("meta"); note("Змінено порядок груп"); refresh(); } break; }
    case "editTx": txSheet(id); break;
    case "clearCatFilter": S.catFilter = ""; refresh(); break;
    case "workCalc": workCalc(); break;
    case "txPrev": S.txM = addMonth(S.txM || curMonth(), -1); S.txLimit = 60; renderTx(); break;
    case "txNext": S.txM = addMonth(S.txM || curMonth(), 1); S.txLimit = 60; renderTx(); break;
    case "showUncat": S.catFilter = "__none"; S.tab = "tx"; refresh(); break;
    case "more": S.txLimit += 150; refresh(); break;
    case "openAcc": accSheet(id); break;
    case "openDebt": debtSheet(id); break;
    case "snow": snowSheet(); break;
    case "upcoming": upSheet(id); break;
    case "rollDebt": {          // погашений борг: його платіж іде на наступний найменший борг
      const a = accById(id); if (!a) break; const cat = catById(a.payCat), amt = (cat && cat.target && cat.target.amt) || 0;
      const F = debtForecast(), nx = F ? F.debts.filter(d => d.a.id !== id && d.owed > 0 && !d.a.needsCheck).sort((x, y) => x.owed - y.owed)[0] : null;
      if (nx && amt){ const nc = catById(nx.a.payCat), cur = nc.target && nc.target.type === "monthly" ? nc.target.amt : (nx.plan ? nx.plan.amt : 0); nc.target = { type:"monthly", amt: cur + amt }; const au = debtSched(nx.a.id); if (au && au.freq === "monthly") au.amt = -(cur + amt); }
      let pillow = null;
      if (!nx && amt){                         // останній борг: платіж іде в заощадження — ціль «Подушка безпеки» (3 місяці витрат)
        pillow = allCats().find(c => !c.pay && /подушк/i.test(c.name));
        if (!pillow){ let g = S.meta.groups.find(x => !x.debts && /ціл|накопич|заощад/i.test(x.name)); if (!g){ g = { id:rid(), name:"Цілі та накопичення", cats:[] }; S.meta.groups.push(g); } pillow = { id:rid(), name:"Подушка безпеки", icon:"🛟" }; g.cats.push(pillow); }
        const R = repData(curMonth()), ms = [1, 2, 3].map(k => addMonth(curMonth(), -k)).filter(k => R.sp[k]), avg = ms.length ? ms.reduce((s, k) => s + Math.abs(R.sp[k]), 0) / ms.length : 0;
        const goal = Math.max(50000, Math.ceil(avg * 3 / 10000) * 10000);
        if (!pillow.target) pillow.target = { type:"date", amt:goal, month: addMonth(curMonth(), Math.max(1, Math.ceil(goal / amt))) };
      }
      if (accBalance(id, true) === 0){ a.closed = true; if (cat) cat.hidden = true; S.meta.sched = S.meta.sched.filter(s => s.to !== id && s.acc !== id); }
      if (cat) delete cat.target;
      markDirty("meta"); note(nx && amt ? "Платіж «" + a.name + "» перенесено на «" + nx.a.name + "»" : pillow ? "Борги закрито, ціль «" + pillow.name + "»" : "Закрито «" + a.name + "»"); refresh();
      toast(nx && amt ? eur(amt) + "/міс тепер іде на «" + nx.a.name + "»" : pillow ? "Ціль «" + pillow.name + "»: " + eur(pillow.target.amt) : "Рахунок закрито"); break;
    }
    case "addAcc": addAccSheet(); break;
    case "addTx": txSheet(null); break;
    case "xferTx": txSheet(null, { kind:"xfer" }); break;
    case "txAll": S.accFilter = ""; S.catFilter = ""; S.tab = "tx"; refresh(); break;
    case "moveAny": moveAnySheet(); break;
    case "sched": schedSheet(); break;
    case "editSched": txSheet(null, null, id); break;
    case "addDebt": addAccSheet("debt"); break;
    case "newGoal": goalSheet(); break;
    case "repTbl": S.repTbl = S.repTbl || {}; S.repTbl[id] = !S.repTbl[id]; refresh(); break;
    case "repAll": S.repAll = !S.repAll; refresh(); break;
    case "rpShift": S.month = addMonth(S.month, (+id) * (REP_N[S.repP] || 1)); refresh(); break;
    case "rpMonth": S.repP = "m"; S.month = id; refresh(); window.scrollTo(0, 0); break;
    case "repCat": catTrendSheet(id); break;
    case "repPayee": { const name = REP.payees[+id]; if (name != null){ const P = repPeriod(); S.search = name; S.accFilter = ""; S.catFilter = ""; S.txKind = "out";
      if (P.n === 1){ S.txPer = "m"; S.txM = P.end; } else { S.txPer = "r"; S.txFrom = P.ms[0] + "-01"; S.txTo = monthEnd(P.end); } S.tab = "tx"; window.scrollTo(0, 0); refresh(); } break; }
  }
});
document.querySelectorAll(".nav button[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab !== "tx"){ S.catFilter = ""; } window.scrollTo(0, 0); refresh(); });
function primeKeyboard(){            // iPhone показує клавіатуру лише з дотику: на мить фокусуємо невидиме поле, потім — суму
  let k = document.getElementById("kbPrime");
  if (!k){ k = document.createElement("input"); k.id = "kbPrime"; k.type = "text"; k.setAttribute("inputmode", "decimal"); k.setAttribute("aria-hidden", "true"); k.tabIndex = -1;
    k.style.cssText = "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0;pointer-events:none"; document.body.appendChild(k); }
  try { k.focus({ preventScroll:true }); } catch(_){}
  setTimeout(() => { if (document.activeElement === k) k.blur(); }, 600);
}
$("navAdd").onclick = () => primeKeyboard() || txSheet(null, S.tab === "tx" && S.catFilter && S.catFilter !== "__none" ? { cat:S.catFilter } : S.tab === "tx" && S.accFilter ? { acc:S.accFilter } : null);
window.addEventListener("pagehide", () => { if (dirty.size) flush(); });
document.addEventListener("pointerdown", () => { for (const f of vzHiders) f(); }, true);      // Tipp woandershin schließt offene Diagramm-Tooltips
let vzRz; window.addEventListener("resize", () => { clearTimeout(vzRz); vzRz = setTimeout(() => { if (S.meta && S.tab === "rep" && !sheetEl && $("view").clientWidth !== vzLastW) renderRep(); }, 150); });
document.addEventListener("visibilitychange", () => { if (document.hidden && dirty.size) flush(); });

init();
if (window.__expose) window.__app = { S, accBalance, allTx, findTx, catById, allCats, compute, undoLast, putTx, todayStr, refresh, workStr, setHide };   // nur für automatische Tests
})();
