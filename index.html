<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мій бюджет</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120f" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#08090c; --card:#15171c; --card2:#1d2027; --text:#f5f6f8; --muted:#8b92a1; --line:rgba(255,255,255,.07); --soft:#22252d;
  --accent:#4f7cff; --accent2:#9b5cff; --accent-soft:rgba(79,124,255,.16);
  --pos:#2fd480; --pos-soft:rgba(47,212,128,.14); --neg:#ff5a5f; --neg-soft:rgba(255,90,95,.15); --warn:#ffb547; --warn-soft:rgba(255,181,71,.15);
  --r:22px;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px;position:relative}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* Hintergrund-Glow */
.glow{position:absolute;left:0;right:0;top:-120px;height:520px;z-index:0;pointer-events:none;overflow:hidden}
.glow::before{content:"";position:absolute;top:0;bottom:0;left:-30%;right:-30%;
  background:radial-gradient(45% 50% at 30% 40%, rgba(79,124,255,.55), transparent 70%),radial-gradient(40% 45% at 75% 30%, rgba(155,92,255,.45), transparent 70%),radial-gradient(35% 35% at 55% 70%, rgba(47,212,200,.18), transparent 70%);filter:blur(10px)}
.glow.small{height:300px;opacity:.6}
main,.top,.sync{position:relative;z-index:1}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.top h1{font-size:26px;font-weight:750;margin:0;flex:1;letter-spacing:-.02em}
.iconbtn{border:0;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.sp{flex:1}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 4px;min-height:14px}

/* Hero */
.hero{text-align:center;padding:18px 0 8px}
.mpill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:3px;font-size:13.5px;font-weight:600}
.mpill button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;color:var(--text)}
.mpill span{padding:0 6px;min-width:120px}
.hero .lbl{font-size:13.5px;color:rgba(255,255,255,.75);margin-top:16px}
.hero .amount{font-size:44px;font-weight:750;letter-spacing:-.03em;margin:2px 0 4px;line-height:1.1}
.hero .amount .c{font-size:26px;opacity:.85}
.hero .amount.neg{color:var(--neg)}
.hero .sub{font-size:13px;color:rgba(255,255,255,.7)}
.badge{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12)}
.badge.pos{background:var(--pos-soft);color:var(--pos)} .badge.neg{background:var(--neg-soft);color:var(--neg)}
.actions{display:flex;justify-content:center;gap:18px;margin:20px 0 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;font-size:12px;color:var(--text);width:68px}
.act i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;font-style:normal}
.act i svg{width:22px;height:22px}
.act.on i{background:var(--text);color:var(--bg)}
.act:disabled{opacity:.4}

/* Karten & Listen */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;cursor:pointer}
.sec-h .n{flex:1;font-size:15px;font-weight:700}
.sec-h .s{font-size:13.5px;color:var(--muted);font-weight:500}
.sec-h .chev{color:var(--muted);transition:transform .2s;font-size:12px}
.sec-h.col .chev{transform:rotate(-90deg)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row-i{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative}
.row-i + .row-i::before{content:"";position:absolute;left:66px;right:14px;top:0;height:1px;background:var(--line)}
.row-i:active{background:rgba(255,255,255,.03)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;position:relative}
.av svg{width:20px;height:20px}
.av .ring{position:absolute;inset:-3px;border-radius:50%;-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px))}
.row-i .m{flex:1;min-width:0}
.row-i .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row-i .st{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .st.w{white-space:normal}
.row-i .r{text-align:right;flex:none}
.row-i .r .v{font-weight:650;font-size:15px}
.row-i .r .st{margin-top:1px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.warn{color:var(--warn)} .v.zero{color:var(--muted)}
.hidden-cat{opacity:.45}
.ed{display:flex;gap:6px}
.mini{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mini:disabled{opacity:.3}
.edit-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;display:flex;align-items:center;gap:10px}

/* Buttons */
.btn{border:0;background:var(--accent);color:#fff;font-weight:650;border-radius:999px;padding:12px 18px;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45}
.btn.wide{width:100%;padding:15px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;border:0;cursor:pointer;font-weight:600}

/* Transaktionen */
.filters{display:flex;gap:8px;margin:6px 0 10px}
.seg.tx-kind{margin:0 0 10px}
.tx-tot{font-size:13.5px;color:var(--muted);margin:-2px 4px 10px}
.seg.tx-per{margin:0 0 8px}
.tx-pnav{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 10px}
.tx-pnav button{border:0;background:var(--soft);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.tx-pnav b{min-width:150px;text-align:center;font-size:15px}
.tx-dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:0 0 10px}
.tx-dates input{width:100%;min-width:0}
.tx-dates span{color:var(--muted)}
.wk{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap}
small.wk{display:inline;margin:0 0 0 6px}
.wkhint{font-size:13px;color:var(--muted);text-align:center;min-height:0;margin:2px 0 4px}
.wkhint:empty{display:none}
.wk-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--line);background:none;color:var(--accent);border-radius:var(--r);padding:11px;margin:10px 0 0;font-weight:600;cursor:pointer}
.wk-set{padding:4px 16px 12px}
.wk-set .wr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:.5px solid var(--line);font-size:15px}
.wk-set .wr:first-child{border-top:0}
.wk-set select,.wk-set input{max-width:170px;text-align:right}
.wk-set .wsum{font-size:13px;color:var(--muted);padding:8px 0 0;border-top:.5px solid var(--line)}
.wc-out{text-align:center;padding:6px 0 4px}
.wc-out b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em}
.wc-out span{display:block;color:var(--muted);margin-top:4px}
.wc-n{font-size:13px;text-align:center}
.tx-tot b{color:var(--text)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0!important;background:none!important;padding:11px 0!important}
.filters select{width:auto!important;border-radius:999px!important;background:var(--card)!important;border:0!important;padding:11px 14px!important;font-size:14px!important}
.day{font-size:13.5px;color:var(--muted);font-weight:600;margin:16px 6px 8px}
.amt{font-weight:650}
.amt.in{color:var(--pos)}

/* Konten / Berichte */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;margin-top:3px}
.hb{margin:12px 0}
.hb .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}
.hb .b{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.mrow{display:grid;grid-template-columns:56px 1fr 96px;gap:10px;align-items:center;font-size:13px;margin:10px 0}
.mrow .bars{display:flex;flex-direction:column;gap:4px}
.mrow .bars i{display:block;height:7px;border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
h3{font-size:16px;margin:0 0 10px;font-weight:700}

/* Navigation unten */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:calc(100% - 28px);max-width:420px;background:rgba(30,32,38,.82);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06)}
.nav .in{display:flex;padding:6px}
.nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:999px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text);background:rgba(255,255,255,.08);font-weight:600}
.fab{position:fixed;right:max(18px, calc(50% - 262px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px rgba(79,124,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* Bottom-Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet .hd{display:flex;align-items:center;margin-bottom:14px;gap:10px}
.sheet .hd b{flex:1;font-size:19px;font-weight:700}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
input[type=text],input[type=date],input[type=number],input[type=month],select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:0;border-radius:14px;background:var(--soft);color:var(--text);outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
.amtw{display:flex;justify-content:center;align-items:baseline;max-width:100%;overflow:hidden}
.amtw input.amtin,.txtop .amtw input.amtin{flex:0 1 auto;text-align:right;padding-left:0;padding-right:0;min-width:24px}
.amtw input.amtin:placeholder-shown{text-align:center}
.amt-gh{font-size:inherit;font-weight:inherit;color:var(--muted);opacity:.55;white-space:pre;pointer-events:none}
input.amtin{font-size:38px;font-weight:750;text-align:center;padding:14px;background:none;letter-spacing:-.02em}
input.amtin:focus{box-shadow:none}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--soft);border-radius:16px;padding:10px;text-align:center;font-weight:650}
.stats small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600}
.sep{height:1px;background:var(--line);margin:16px 0}
.help p{margin:0 0 10px}
.help b{color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.emojis button{border:0;background:var(--soft);border-radius:12px;aspect-ratio:1;font-size:20px;cursor:pointer}
.emojis button.on{box-shadow:0 0 0 2px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#f5f6f8;color:#111;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;opacity:0;transition:all .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{text-align:center;padding:60px 10px;color:var(--muted)}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F2F2F7;color:#000;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;transition:opacity .35s ease,transform .35s ease}
.splash.out{opacity:0;pointer-events:none;transform:scale(1.03)}
.sp-ic{width:96px;height:96px;border-radius:22px;box-shadow:0 10px 30px -10px rgba(0,0,0,.35);animation:spIn .5s cubic-bezier(.2,.9,.3,1.2) both}
.sp-t{font-size:20px;font-weight:600;letter-spacing:-.01em;animation:spFade .5s .1s both}
.sp-spin{position:relative;width:24px;height:24px;margin-top:26px;animation:spFade .4s .35s both}
.sp-spin i{position:absolute;left:10.75px;top:0;width:2.5px;height:7px;border-radius:2px;background:currentColor;transform-origin:1.25px 12px;opacity:.15;animation:spTick 1s linear infinite}
@keyframes spTick{0%{opacity:.8}100%{opacity:.15}}
@keyframes spIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes spFade{from{opacity:0}to{opacity:1}}
@media (prefers-color-scheme: dark){ .splash{background:#000;color:#fff} }
@media (prefers-reduced-motion: reduce){ .sp-ic,.sp-t,.sp-spin{animation:none} .sp-spin i{animation-duration:2s} }
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
[hidden]{display:none!important}


/* Fortschrittsbalken, Schnellauswahl, Hinweise */
.card .pb{max-width:none;height:6px;border-radius:3px}
.pb.lim i{background:var(--accent)}
.pb{height:4px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden;max-width:230px}
.pb i{display:block;height:100%;border-radius:2px;background:var(--pos)}
.pb.warn i{background:var(--warn)} .pb.neg i{background:var(--neg)}
.qrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qrow:empty{display:none}
.qrow button{border:0;background:var(--soft);color:var(--text);border-radius:999px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.qrow button.on{background:var(--accent);color:#fff}
.info{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.info:empty{display:none}
.info.neg{color:var(--neg);font-weight:600}
#tHint{margin:-6px 2px 12px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;margin:-2px 2px 12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.big{font-size:28px;font-weight:750;letter-spacing:-.02em}
.st2{font-size:12.5px;color:var(--warn);margin-top:5px}
.hb[data-act]{cursor:pointer}
.nav .add{flex:0 0 62px;padding:0;justify-content:center;background:none!important}
.nav .add span{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(79,124,255,.4)}
.nav .add svg{width:24px;height:24px}
.toast{top:calc(60px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%) translateY(-10px);display:flex;align-items:center;gap:12px;width:max-content;border-radius:18px}
.toast.on{transform:translateX(-50%)}
.toast.on.wbtn{pointer-events:auto}
.toast.low,body.apple .toast.low{top:auto;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px)}
.toast.low.on,body.apple .toast.low.on{transform:translateX(-50%)}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:10px 8px;margin:-10px -8px -10px 0;cursor:pointer;white-space:nowrap;flex:none}
.tip{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.35}
.tip .tt{flex:1}
.tip.neg{background:var(--neg-soft)} .tip.warn{background:var(--warn-soft)}
.tip .btn{flex:none}
.tip .tb{display:flex;flex-direction:column;gap:6px;flex:none}
.sheet{max-height:92dvh}
.filters select{font-size:16px!important}
.act{white-space:nowrap}
body:not(.apple) .actions{gap:12px}
body:not(.apple) .act{width:76px}

/* ===================== Apple-/iOS-Stil ===================== */
.only-apple{display:none!important}
body.apple .only-apple{display:flex!important}
body:not(.apple) .neo-hide{visibility:hidden}
body.apple{
  --bg:#f2f2f7; --card:#fff; --card2:#fff; --text:#000; --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.29); --soft:rgba(118,118,128,.12);
  --accent:#007aff; --accent2:#007aff; --accent-soft:rgba(0,122,255,.12);
  --pos:#34c759; --pos-soft:rgba(52,199,89,.15); --neg:#ff3b30; --neg-soft:rgba(255,59,48,.12); --warn:#ff9500; --warn-soft:rgba(255,149,0,.15);
  --segon:#fff; --segtxt:#000; --tabbar:rgba(249,249,249,.88); --r:12px;
  color-scheme:light; background:var(--bg); min-height:100vh;

/* ===== Дизайн «Bento»: пастельні плитки, округлий шрифт, плаваюче меню ===== */

.rp-chg .good{color:var(--pos)} .rp-chg .bad{color:var(--neg)}

.rp-mb{display:flex;gap:2px;height:7px;margin:3px 0}
.rp-mb i{display:block;height:100%;border-radius:0 3px 3px 0}
.rp-ms{font-size:12px;color:var(--muted)}
.rp-bank h3{margin-bottom:6px}
.rp-bk{font-size:13.5px;padding:8px 0 4px;border-top:1px solid var(--line)}
.rp-bkd{font-size:12px;color:var(--muted);margin:6px 0 2px}

<script>
(function(){
"use strict";

/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v);
const NF = new Intl.NumberFormat("uk-UA", { minimumFractionDigits:2, maximumFractionDigits:2 });
let HIDE = false; try { HIDE = localStorage.getItem("budget-hide-amounts") === "1"; } catch(_){}   // «Приховати суми»: лише на цьому пристрої
const MASK = "•••";
const eur = c => HIDE ? MASK + " €" : (c < 0 ? "−" : "") + NF.format(Math.abs(c || 0) / 100).replace(/[\u00a0\u202f]/g, " ") + " €";
const MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_LOC = ["січні","лютому","березні","квітні","травні","червні","липні","серпні","вересні","жовтні","листопаді","грудні"];
const MSHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const WD = ["нд","пн","вт","ср","чт","пт","сб"];
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); };
const curMonth = () => todayStr().slice(0, 7);
const debtAcc = id => { const a = S.meta && S.meta.accounts.find(x => x.id === id); return !!(a && a.payCat && allCats().some(c => c.id === a.payCat)); };
const isUnc = t => !t.to && !t.cat && !t.sys && !debtAcc(t.acc);
const addMonth = (m, k) => { let y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + k; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + "-" + pad2(mo + 1); };
const monthDiff = (a, b) => (+b.slice(0,4) - +a.slice(0,4)) * 12 + (+b.slice(5,7) - +a.slice(5,7));
const monthLabel = m => { const s = MONTHS[+m.slice(5,7)-1]; return s[0].toUpperCase() + s.slice(1) + " " + m.slice(0,4); };
const dayLabel = d => { const dt = new Date(d + "T12:00:00"); return dt.getDate() + " " + MONTHS_GEN[dt.getMonth()] + (d.slice(0,4) !== todayStr().slice(0,4) ? " " + d.slice(0,4) : "") + ", " + WD[dt.getDay()]; };
function parseAmt(str){
  if (str == null) return NaN;
  let s = String(str).replace(/[\s€ ]/g, "").replace(/−/g, "-");
  if (/,\d{1,2}$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else s = s.replace(/,/g, "");
  if (!/^[+-]?\d*\.?\d+$/.test(s) && !/^[+-]?\d+\.?$/.test(s)) return NaN;
  return Math.round(parseFloat(s) * 100);
}
const amtStr = c => c ? (c / 100).toFixed(2).replace(".", ",") : "";
/* Поле суми: поки вводите «50», сірим дописується «,00 €»; після виходу з поля — «50,00». */
function amtGhost(inp){
  const gh = inp.parentNode.querySelector(".amt-gh"); if (!gh) return;
  const cv = amtGhost.cv || (amtGhost.cv = document.createElement("canvas").getContext("2d"));
  const fit = () => {
    const v = inp.value, cs = getComputedStyle(inp);
    gh.textContent = !v ? "" : /[.,]\d{2,}$/.test(v) ? " €" : /[.,]\d$/.test(v) ? "0 €" : /[.,]$/.test(v) ? "00 €" : ",00 €";
    gh.style.fontSize = cs.fontSize; gh.style.fontWeight = cs.fontWeight; gh.style.letterSpacing = cs.letterSpacing;
    if (!v){ inp.style.width = ""; return; }
    cv.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    const w = cv.measureText(v).width + (parseFloat(cs.letterSpacing) || 0) * v.length + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0) + 4;
    inp.style.width = Math.ceil(w) + "px";
  };
  inp.addEventListener("input", fit);
  inp.addEventListener("blur", () => { const c = parseAmt(inp.value); if (c > 0 && inp.value !== amtStr(c)){ inp.value = amtStr(c); fit(); } });
  requestAnimationFrame(fit); fit();
}
function toast(msg, action){
  const t = $("toast");
  if (undoPending && !undoPending.locked) undoPending.label = msg;
  if (!action && undoPending && !undoPending.silent){ const u = undoPending; action = { label:"Скасувати", fn: () => undoEntry(u) }; }
  t.textContent = "";
  const sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  if (action){ const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { t.classList.remove("on"); action.fn(); }; t.appendChild(b); }
  t.classList.toggle("wbtn", !!action); t.classList.toggle("low", !sheetEl); t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), action ? 7000 : 2600);
}
const dstr = d => d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate());
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dstr(d); };
const daysIn = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();
const monthEnd = m => m + "-" + String(daysIn(m)).padStart(2, "0");
/* ---------- Ціна в робочих годинах (типово вимкнено; вмикається в налаштуваннях) ----------
   Ставка за годину рахується для кожного місяця окремо: зарплата цього місяця / робочі години цього місяця
   (будні дні × годин на тиждень / 5). Зарплата — з вибраного джерела доходу або вписана вручну. */
const WK = { c:{},
  cfg: () => (S.meta && S.meta.work) || null,
  on: () => !!(WK.cfg() && WK.cfg().on),
  show: () => !!(WK.cfg() && WK.cfg().on && WK.cfg().show) && !HIDE };
function workDays(m){ const y = +m.slice(0, 4), mo = +m.slice(5, 7) - 1, n = daysIn(m); let d = 0; for (let i = 1; i <= n; i++){ const w = new Date(y, mo, i).getDay(); if (w && w !== 6) d++; } return d; }
const workHours = m => workDays(m) * ((WK.cfg() || {}).hpw || 40) / 5;
function incomeSources(){      // джерела доходу за пів року: ключ → { name, sum }
  const since = addMonth(curMonth(), -6), o = {};
  for (const t of allTx()) if (t.cat === "rta" && t.amt > 0 && !t.sys && t.date.slice(0, 7) >= since){ const k = merchKey(t) || normTxt(t.payee); if (!k) continue; const x = o[k] = o[k] || { name:t.payee || k, sum:0 }; x.sum += t.amt; }
  return o;
}
function workSalary(m){
  const w = WK.cfg(); if (!w) return 0;
  if (w.src === "man") return w.salary || 0;
  for (let k = 0; k < 4; k++){                // немає зарплати в цьому місяці (ще не прийшла) — беремо попередній
    const mm = addMonth(m, -k); let sum = 0;
    for (const t of allTx()) if (t.cat === "rta" && t.amt > 0 && !t.sys && incomeMonth(t) === mm && (!w.src || w.src === "all" || (merchKey(t) || normTxt(t.payee)) === w.src)) sum += t.amt;
    if (sum > 0) return sum;
  }
  return w.salary || 0;
}
function workRate(m){            // центів за годину
  if (WK.c[m] != null) return WK.c[m];
  const h = workHours(m), sal = workSalary(m);
  return WK.c[m] = h > 0 && sal > 0 ? sal / h : 0;
}
function workRateOf(m){          // місяць або кілька місяців (сумарна зарплата / сумарні години)
  if (!Array.isArray(m)) return workRate(m);
  let sal = 0, h = 0; m.forEach(x => { if (workRate(x)){ sal += workRate(x) * workHours(x); h += workHours(x); } }); return h ? sal / h : 0;
}
const hrs = h => String(Math.round(h * 10) / 10).replace(".", ",");
const workFormula = m => { const r = workRate(m); return r ? eur(workSalary(m)) + " ÷ " + hrs(workHours(m)) + " год (" + workDays(m) + " роб. дн. × " + String(Math.round(((WK.cfg() || {}).hpw || 40) / 5 * 100) / 100).replace(".", ",") + " год) ≈ " + eur(Math.round(r)) + " за годину" : ""; };
function workMonths(cents, m){     // скільки місяців роботи: [місяців дробом, повних місяців, решта робочих днів]
  const ms = Array.isArray(m) ? m : [m], sal = ms.reduce((a, x) => a + workSalary(x), 0) / ms.length, wd = ms.reduce((a, x) => a + workDays(x), 0) / ms.length;
  if (!sal) return null;
  const f = Math.abs(cents) / sal; let full = Math.floor(f), d = Math.round((f - full) * wd);
  if (d >= Math.round(wd)){ full++; d = 0; }
  return [f, full, d];
}
const monthsLabel = (full, d) => { const y = Math.floor(full / 12), mo = full % 12;
  return (y ? y.toLocaleString("uk-UA") + " " + plural(y, "рік", "роки", "років") + " " : "") + (mo || !y ? mo + " міс." : "") + (d ? " " + d + " роб. " + plural(d, "день", "дні", "днів") : ""); };
const nf = (n, dg) => n.toLocaleString("uk-UA", { minimumFractionDigits: dg || 0, maximumFractionDigits: dg || 0 });
function workStr(cents, m){
  const r = workRateOf(m); if (!r || !cents) return "";
  const min = Math.max(1, Math.round(Math.abs(cents) / r * 60)), hd = ((WK.cfg() || {}).hpw || 40) / 5;
  if (min < 60) return min + " хв";
  const h = Math.floor(min / 60), mm = min % 60, s = h + " год" + (mm && h < 10 ? " " + mm + " хв" : "");
  const M = workMonths(cents, m);
  if (M && M[0] >= 1) return monthsLabel(M[1], M[2]).trim() + " (" + nf(h) + " год)";        // від місячної зарплати й більше — у місяцях
  return min >= hd * 60 * 2 ? s + " (≈ " + String(Math.round(min / 60 / hd * 10) / 10).replace(".", ",") + " роб. дн.)" : s;
}
const wkTag = (cents, m, inline) => WK.show() && cents > 0 && workRateOf(m) ? (inline ? ' <small class="wk">⏱ ' : '<span class="wk">⏱ ') + workStr(cents, m) + (inline ? '</small>' : '</span>') : "";
function workCalc(){
  const m = curMonth();
  openSheet("Скільки годин роботи?", '<div class="txtop"><div class="amtw"><input class="amtin num" id="wcA" type="text" inputmode="decimal" placeholder="0,00 €" aria-label="Сума покупки"><span class="amt-gh"></span></div></div><div class="wc-out" id="wcO"></div>' +
    '<p class="muted wc-n" id="wcN"></p>', el => {
    const a = q(el,"#wcA"), o = q(el,"#wcO"), r = workRate(m); amtGhost(a);
    q(el,"#wcN").textContent = r ? MONTHS[+m.slice(5, 7) - 1] + ": " + workFormula(m) : "Не вистачає даних: вкажіть зарплату в налаштуваннях.";
    const upd = () => { const c = parseAmt(a.value) || 0, sal = workSalary(m);
      const M = c > 0 && r ? workMonths(c, m) : null, big = M && M[0] >= 1;
      o.innerHTML = c > 0 && r ? '<b>' + (big ? monthsLabel(M[1], M[2]).trim() : workStr(c, m)) + '</b><span>' + (big ? "≈ " + nf(Math.floor(c / r)) + " год вашої роботи · це " + (M[0] >= 12 ? nf(M[0] / 12, 1) + " річної зарплати" : nf(M[0], 2) + " місячної зарплати")
        : "вашої роботи" + (sal ? " · " + String(Math.round(c / sal * 1000) / 10).replace(".", ",") + " % місячної зарплати" : "")) + '</span>' : ""; };
    a.addEventListener("input", upd); setTimeout(() => { try { a.focus({ preventScroll:true }); } catch(_){ a.focus(); } }, 60);
  });
}
const clamp01 = x => Math.min(1, Math.max(0, x));
const shortDate = d => +d.slice(8,10) + " " + MSHORT[+d.slice(5,7)-1] + (d.slice(0,4) !== todayStr().slice(0,4) ? " " + d.slice(0,4) : "");

/* =====================================================================
   Zustand
   ===================================================================== */
const S = { meta:null, tx:{}, tab:"acc", month:curMonth(), edit:false, collapsed:{}, accFilter:"", catFilter:"", search:"", txLimit:150 };
const ACC_TYPES = { checking:"Поточний", savings:"Ощадний", cash:"Готівка", credit:"Кредитна картка", debt:"Борг / розстрочка (Klarna, кредит)" };
const TEMPLATES = {
  std: [
    ["Обов'язкові", ["Оренда","Комунальні послуги","Інтернет і мобільний","Страхування","Транспорт"]],
    ["Щоденні витрати", ["Продукти","Кафе та доставка","Побутові товари","Одяг","Здоров'я та аптека"]],
    ["Нерегулярні витрати", ["Подарунки","Техніка та ремонт","Річні платежі","Навчання","Онлайн-покупки","Посилки та пошта","Комісії банку","Інше"]],
    ["Цілі та накопичення", ["Подушка безпеки","Внесок на житло","Відпустка","Інвестиції"]],
    ["Задоволення", ["Розваги","Підписки","Хобі"]]
  ],
  empty: [["Мої категорії", ["Продукти","Оренда"]]]
};
function newMeta(tpl){
  return { v:1, mig:3, accounts:[], assigned:{}, payeeCat:{}, sched:[],
    groups: TEMPLATES[tpl].map(([g, cs]) => ({ id:rid(), name:g, cats: cs.map(n => ({ id:rid(), name:n })) })) };
}
function normMeta(m){
  m.accounts = m.accounts || []; m.groups = m.groups || []; m.assigned = m.assigned || {}; m.payeeCat = m.payeeCat || {}; m.sched = m.sched || [];
  m.groups.forEach(g => g.cats = g.cats || []);
  return m;
}
const allCats = () => S.meta.groups.flatMap(g => g.cats);
const catById = id => allCats().find(c => c.id === id);
const accById = id => S.meta.accounts.find(a => a.id === id);
const allTx = () => Object.values(S.tx).flat();
/* Початок бюджету: перший стартовий баланс (або перша операція). Раніші операції з виписки — «історія» (t.hist):
   вони є у звітах і списку, але не змінюють ні залишки рахунків, ні бюджет — стартовий баланс уже містить їх. */
function budgetStartDate(){
  let d = ""; for (const t of allTx()) if (t.sys === "start" && !t.hist && (!d || t.date < d)) d = t.date;
  if (!d) for (const t of allTx()) if (!t.hist && (!d || t.date < d)) d = t.date;
  return d;
}
const budgetStart = () => (budgetStartDate() || todayStr()).slice(0, 7);
/* Зарплата, що приходить наприкінці місяця, — гроші на наступний місяць: з дня S.meta.incNext (напр. 20) дохід рахується наступним місяцем */
const incomeMonth = t => { const d = S.meta && S.meta.incNext, m = t.date.slice(0, 7); return d && t.cat === "rta" && t.amt > 0 && !t.sys && +t.date.slice(8, 10) >= d ? addMonth(m, 1) : m; };
function findTx(id){ for (const k in S.tx){ const i = S.tx[k].findIndex(t => t.id === id); if (i >= 0) return { k, i, t:S.tx[k][i] }; } return null; }
function putTx(t){
  const old = findTx(t.id);
  if (old){ S.tx[old.k].splice(old.i, 1); markDirty(old.k); }
  const k = t.date.slice(0, 7); (S.tx[k] = S.tx[k] || []).push(t); markDirty(k);
  if (t.payee && t.cat && !t.to) { S.meta.payeeCat[t.payee] = t.cat; markDirty("meta"); }
}
function delTx(id){ const f = findTx(id); if (f){ S.tx[f.k].splice(f.i, 1); markDirty(f.k); } }
function setAssigned(m, catId, cents){
  const a = S.meta.assigned[m] = S.meta.assigned[m] || {};
  if (cents) a[catId] = cents; else delete a[catId];
  if (!Object.keys(a).length) delete S.meta.assigned[m];
  markDirty("meta");
}

/* ---------- Regelmäßige Buchungen ---------- */
const FREQ = { weekly:"Щотижня", biweekly:"Кожні 2 тижні", monthly:"Щомісяця", quarterly:"Щокварталу", yearly:"Щороку" };
function schedNext(s){
  if (s.freq === "weekly") return addDays(s.next, 7);
  if (s.freq === "biweekly") return addDays(s.next, 14);
  const k = s.freq === "yearly" ? 12 : s.freq === "quarterly" ? 3 : 1;
  const m = addMonth(s.next.slice(0, 7), k);
  return m + "-" + pad2(Math.min(s.day || +s.next.slice(8, 10), daysIn(m)));
}
/* Fällige Buchungen eintragen. Feste IDs (Plan + Datum) verhindern Dubletten, wenn zwei Geräte gleichzeitig buchen. */
function runScheduled(){
  const list = S.meta && S.meta.sched; if (!list || !list.length) return 0;
  const today = todayStr(), done = []; let n = 0, changed = false;
  passive = true;
  try {
    for (const s of list){
      if (!s.next || !FREQ[s.freq]) continue;
      for (let guard = 0; s.next <= today && guard < 60; guard++){
        if (accById(s.acc) && (!s.to || accById(s.to))){
          const id = "s" + s.id + s.next.replace(/-/g, "");
          if (!findTx(id)){
            const dest = s.to ? accById(s.to) : null, debt = dest && dest.payCat && catById(dest.payCat) ? dest : null;
            let amt = s.amt, last = false;
            if (debt){                                 // Rate an ein Schuldenkonto: nie mehr als die Restschuld, danach endet der Plan
              const owed = Math.max(0, -accBalance(debt.id));
              if (owed <= 0){ done.push(s.id); changed = true; break; }
              if (-amt >= owed){ amt = -owed; last = true; }
            }
            const t = { id, ts:Date.now(), date:s.next, amt, acc:s.acc, cat:s.to ? null : (s.cat || null), payee:s.to ? "" : (s.payee || ""), memo:s.memo || "", sched:s.id };
            if (s.to) t.to = s.to;
            putTx(t); n++;
            if (debt) coverDebtPayment(t);
            if (last){ done.push(s.id); changed = true; break; }
          }
        }
        s.next = schedNext(s); changed = true;
      }
    }
    if (done.length) S.meta.sched = S.meta.sched.filter(s => !done.includes(s.id));
    if (changed) markDirty("meta");
  } finally { passive = false; }
  return n;
}
/* Zahlung an ein Schuldenkonto: reicht das Zurückgelegte nicht, wird der Rest aus „Bereit zum Zuweisen“ zugewiesen */
function coverDebtPayment(t){
  const d = accById(t.to); if (!d || !d.payCat || !catById(d.payCat)) return 0;
  const m = t.date.slice(0, 7), p = compute(m).per[d.payCat];
  if (p.available >= 0) return 0;
  setAssigned(m, d.payCat, p.assigned - p.available);
  return -p.available;
}

/* =====================================================================
   Budget-Rechnung (Methode: jeder Euro bekommt eine Aufgabe)
   - Verfügbar = positiver Übertrag + Zugewiesen + Aktivität
   - Überzogene Kategorien werden im Folgemonat auf 0 gesetzt, der Betrag
     wird von „Готово до розподілу“ abgezogen
   - Zuweisungen in künftigen Monaten mindern das aktuelle „Готово“
   ===================================================================== */
function compute(view){
  const catsAll = allCats(), cats = catsAll.map(c => c.id);
  // Schuldenkonten (Klarna, Kredit, Kreditkarte): Konto -> Tilgungskategorie
  const payOf = {};
  S.meta.accounts.forEach(a => { if (a.payCat && cats.includes(a.payCat)) payOf[a.id] = a.payCat; });
  const inc = {}, act = {}, real = {}, owed = {}, paid = {}, paidNow = {}, nowM = curMonth();
  const addAct = (m, c, v) => { const o = act[m] = act[m] || {}; o[c] = (o[c] || 0) + v; };
  let minM = view;
  for (const t of allTx()){
    if (t.hist) continue;
    const m = t.date.slice(0, 7);
    if (m < minM) minM = m;
    const pa = payOf[t.acc], pt = t.to ? payOf[t.to] : null;
    if (m <= view){ if (pa) owed[t.acc] = (owed[t.acc] || 0) - t.amt; if (pt) owed[t.to] = (owed[t.to] || 0) + t.amt; }
    if (pt && m === view) paid[t.to] = (paid[t.to] || 0) - t.amt;
    if (pt && m === nowM) paidNow[t.to] = (paidNow[t.to] || 0) - t.amt;
    if (t.to){                                   // Überweisung: Zahlung an ein Schuldenkonto kommt aus dessen Tilgungskategorie
      if (pa) addAct(m, pa, -t.amt);
      if (pt) addAct(m, pt, t.amt);
      continue;
    }
    if (pa){                                     // Kauf auf Pump: Geld wandert aus der Kategorie in die Tilgungskategorie
      if (!t.cat) continue;                      // Anfangsschuld / Korrektur: nur die Schuld ändert sich
      addAct(m, pa, -t.amt);
    }
    if (t.cat === "rta"){ const im = incomeMonth(t); inc[im] = (inc[im] || 0) + t.amt; if (!t.sys && !pa) real[im] = (real[im] || 0) + t.amt; }
    else if (t.cat) addAct(m, t.cat, t.amt);
    else if (!pa && !t.sys) inc[m] = (inc[m] || 0) + t.amt;   // ohne Kategorie: mindert «Готово до розподілу», bis sie zugeordnet ist
  }
  for (const m in S.meta.assigned) if (m < minM) minM = m;
  let rta = 0, over = 0; const carry = {};
  let per = {};
  for (let m = minM; m <= view; m = addMonth(m, 1)){
    const asg = S.meta.assigned[m] || {};
    let asgSum = 0; for (const k in asg) asgSum += asg[k];
    rta += (inc[m] || 0) - asgSum - over;
    over = 0; per = {};
    for (const c of cats){
      const start = Math.max(0, carry[c] || 0), a = asg[c] || 0, ac = (act[m] || {})[c] || 0, av = start + a + ac;
      per[c] = { start, assigned:a, activity:ac, available:av };
      carry[c] = av; if (av < 0) over += -av;
    }
  }
  let fut = 0;
  for (const m in S.meta.assigned) if (m > view) for (const k in S.meta.assigned[m]) fut += S.meta.assigned[m][k];
  for (const c of cats) if (!per[c]) per[c] = { start:0, assigned:0, activity:0, available:0 };
  // Zielberechnung
  for (const c of catsAll){
    const p = per[c.id], tg = c.target; p.need = 0; p.under = 0; p.prog = null;
    if (c.pay){
      const o = Math.max(0, owed[c.pay] || 0); p.debt = o; p.paid = paid[c.pay] || 0;
      if (view > nowM && o > 0){                 // Zukunft: Restschuld laut Plan statt heutiger Schuld
        const sd = debtSched(c.pay), K = { weekly:52/12, biweekly:26/12, monthly:1, quarterly:1/3, yearly:1/12 };
        const plan = sd ? Math.max(1, Math.round(-sd.amt * (K[sd.freq] || 1))) : tg && tg.type === "monthly" && tg.amt ? tg.amt : tg && tg.type === "date" && tg.month ? Math.ceil(o / Math.max(1, monthDiff(nowM, tg.month) + 1)) : 0;
        if (plan){
          let left = o;
          for (let k = nowM; k < view && left > 0; k = addMonth(k, 1)){
            const pay = sd ? (k >= sd.next.slice(0, 7) ? plan : 0) : k === nowM ? Math.max(0, plan - (paidNow[c.pay] || 0)) : plan;
            left -= Math.min(left, pay);
            if (left <= Math.max(5, Math.round(plan * .02))) left = 0;
          }
          p.debt = left; p.projected = true;
          if (left <= 0){ p.planDone = true; continue; }
          p.need = tg && tg.type === "date" && tg.month ? Math.ceil(left / Math.max(1, monthDiff(view, tg.month) + 1)) : Math.min(plan, left);
          p.under = Math.max(0, p.need - p.assigned);
          p.prog = clamp01(p.assigned / p.need);
          continue;
        }
      }
      const uncovered = Math.max(0, o - (p.available - p.assigned));
      if (tg && tg.type === "monthly" && tg.amt) p.need = Math.min(tg.amt, uncovered);
      else if (tg && tg.type === "date") p.need = Math.ceil(uncovered / Math.max(1, monthDiff(view, tg.month || view) + 1));
      p.under = Math.max(0, p.need - p.assigned);
      p.prog = o > 0 ? clamp01(p.available / o) : null;
      continue;
    }
    if (!tg || !tg.amt) continue;
    if (tg.type === "monthly"){
      p.need = tg.refill ? Math.max(0, tg.amt - p.start) : tg.amt;
      p.under = Math.max(0, p.need - p.assigned);
      p.prog = clamp01((tg.refill ? p.start + p.assigned : p.assigned) / tg.amt);
    } else if (tg.type === "date"){
      let due = tg.month || view;
      if (tg.repeat) while (due < view) due = addMonth(due, 12);
      p.due = due; p.prog = clamp01(p.available / tg.amt);
      if (due < view){ p.expired = true; continue; }
      p.need = Math.max(0, Math.ceil((tg.amt - p.start) / (monthDiff(view, due) + 1)));
      p.under = Math.max(0, p.need - p.assigned);
    } else if (tg.type === "balance"){
      p.prog = clamp01(p.available / tg.amt);
    }
  }
  const income = real[view] || 0;
  return { per, rta: rta - fut - over, over, income, minM, owed };   // over: schon ausgegeben, also nicht mehr verfügbar
}
function accBalance(id, all){            // залишок на сьогодні; all = разом з майбутніми операціями
  const today = todayStr(); let b = 0;
  for (const t of allTx()){ if (t.hist || (!all && t.date > today)) continue; if (t.acc === id) b += t.amt; if (t.to === id) b -= t.amt; }
  return b;
}
function futureOf(id){                    // майбутні операції рахунку: сума й найближча дата
  const today = todayStr(); let sum = 0, next = null;
  for (const t of allTx()){ if (t.hist || t.date <= today) continue; const v = (t.acc === id ? t.amt : 0) - (t.to === id ? t.amt : 0); if (v){ sum += v; if (!next || t.date < next) next = t.date; } }
  return sum ? { sum, next } : null;
}

/* =====================================================================
   Speicher: Claude-db (privat pro Nutzer) mit Fallback localStorage
   ===================================================================== */
const LS_KEY = "budget-app-v1", APP_VER = "2026-11-24.5";
const store = { kind:null, metaRef:null, txCol:null };
const dirty = new Set(); let saveTimer = null, saving = false, fatal = false;
/* ---------- Rückgängig / Wiederholen ----------
   Alle Änderungen einer Benutzeraktion (ein Tick) bilden einen Eintrag: gemerkt wird der Stand der
   geänderten Dokumente VOR der Aktion. Automatische Buchungen (passive) eröffnen keinen eigenen Eintrag. */
const UNDO_MAX = 25, undoStack = [], redoStack = [];
let committed = { meta:null, tx:{} }, undoPending = null, undoOff = false, passive = false, persistAsked = false;
const snapKey = k => { if (k === "meta") return clone(committed.meta); const a = committed.tx[k]; return a && a.length ? clone(a) : null; };
const liveKey = k => k === "meta" ? clone(S.meta) : (S.tx[k] && S.tx[k].length ? clone(S.tx[k]) : null);
function syncCommitted(){ committed = { meta: clone(S.meta), tx: clone(S.tx) }; }
function commitKey(k){ if (k === "meta") committed.meta = clone(S.meta); else if (S.tx[k] && S.tx[k].length) committed.tx[k] = clone(S.tx[k]); else delete committed.tx[k]; }
function markDirty(k){
  if (!undoOff && committed.meta){
    if (!undoPending){ undoPending = { label:"", time:Date.now(), keys:{}, silent:passive }; setTimeout(commitUndo, 0); }
    else if (!passive) undoPending.silent = false;
    if (!(k in undoPending.keys)) undoPending.keys[k] = snapKey(k);
  }
  if (!persistAsked && store.kind === "local"){ persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(_){} }
  dirty.add(k); clearTimeout(saveTimer); saveTimer = setTimeout(flush, store.kind === "local" ? 0 : 500); setSync("pending");
}
function note(label){ if (undoPending){ undoPending.label = label; undoPending.locked = true; } }
function commitUndo(){
  const u = undoPending; undoPending = null; if (!u) return;
  let changed = false;
  for (const k of Object.keys(u.keys)){
    if (JSON.stringify(liveKey(k)) === JSON.stringify(u.keys[k])) delete u.keys[k]; else changed = true;
    commitKey(k);
  }
  if (changed && !u.silent){
    if (!u.label) u.label = "Зміна";
    undoStack.push(u); if (undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack.length = 0;
  }
  paintUndo();
}
function paintUndo(){ const b = $("undoBtn"); if (b) b.hidden = !(undoStack.length || redoStack.length); }
function applyEntry(u){            // stellt den Stand aus u.keys her und liefert den Gegen-Eintrag
  const back = { label:u.label, time:Date.now(), keys:{} };
  undoOff = true;
  try {
    for (const k of Object.keys(u.keys)){
      back.keys[k] = liveKey(k);
      if (k === "meta") S.meta = normMeta(clone(u.keys[k])); else S.tx[k] = u.keys[k] ? clone(u.keys[k]) : [];
      markDirty(k); commitKey(k);
    }
  } finally { undoOff = false; }
  return back;
}
function undoLast(){
  if (undoPending) commitUndo();
  const u = undoStack.pop(); if (!u) return toast("Немає дій для скасування");
  redoStack.push(applyEntry(u));
  closeSheet(); refresh(); toast("Скасовано: " + u.label, { label:"Повернути", fn: redoLast });
}
function redoLast(){
  if (undoPending) commitUndo();
  const u = redoStack.pop(); if (!u) return;
  undoStack.push(applyEntry(u));
  closeSheet(); refresh(); toast("Повернуто: " + u.label, { label:"Скасувати", fn: undoLast });
}
function undoEntry(u){
  if (undoPending) commitUndo();
  if (undoStack[undoStack.length - 1] === u) undoLast(); else if (undoStack.includes(u)) historySheet();
}
function remoteChanged(k){          // Änderung von einem anderen Gerät: Einträge für dieses Dokument sind nicht mehr gültig
  commitKey(k);
  for (const st of [undoStack, redoStack]) for (let i = st.length - 1; i >= 0; i--) if (k in st[i].keys) st.splice(i, 1);
  paintUndo();
}
/* ---------- Gerätebezogene Notizen und Autokopien (nur lokaler Speicher) ---------- */
const LS_BAK = LS_KEY + "-bak", LS_INFO = LS_KEY + "-info";
function localInfo(patch){
  let o = {}; try { o = JSON.parse(localStorage.getItem(LS_INFO) || "{}") || {}; } catch(_){}
  if (patch){ Object.assign(o, patch); try { localStorage.setItem(LS_INFO, JSON.stringify(o)); } catch(_){} }
  return o;
}
function readBackups(){ try { const b = JSON.parse(localStorage.getItem(LS_BAK) || "[]"); return Array.isArray(b) ? b.filter(x => x && x.day && x.data && x.data.meta) : []; } catch(_){ return []; } }
function rotateBackups(o){          // Stand beim ersten Öffnen des Tages aufheben (2 Generationen)
  try {
    const today = todayStr(), b = readBackups();
    if (b[0] && b[0].day === today) return;
    b.unshift({ day: today, data: o }); b.length = Math.min(b.length, 2);
    localStorage.setItem(LS_BAK, JSON.stringify(b));
  } catch(_){ try { localStorage.removeItem(LS_BAK); } catch(__){} }
}
async function flush(){
  if (fatal) return;
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); return; }
  if (!dirty.size) return;
  saving = true;
  const keys = [...dirty]; dirty.clear();
  try {
    if (store.kind === "local"){
      const json = JSON.stringify({ meta:S.meta, tx:S.tx }); let okLS = true;
      try { localStorage.setItem(LS_KEY, json); } catch(_){ okLS = false; }
      const okN = NATIVE ? await nativeSave(json) : false;
      if (!okLS && !okN) throw { code:"local" };
    } else {
      for (const k of keys){
        if (k === "meta") await store.metaRef.set(clone(S.meta));
        else if (S.tx[k] && S.tx[k].length) await store.txCol.doc(k).set({ items: clone(S.tx[k]) });
        else { delete S.tx[k]; await store.txCol.doc(k).delete(); }
      }
    }
    setSync("ok");
  } catch(e){
    keys.forEach(k => dirty.add(k));
    const code = e && e.code;
    if (code === "invalid_argument" || code === "quota_exceeded" || code === "revoked" || code === "not_granted"){
      fatal = true; setSync("err", code === "quota_exceeded" ? "Сховище заповнене. Експортуйте резервну копію." : "Не вдалося зберегти зміни (немає прав на запис).");
    } else { setSync("err", "Немає зв'язку, повторюю…"); saveTimer = setTimeout(flush, 3000); }
  }
  saving = false;
  if (dirty.size && !fatal && !saveTimer) saveTimer = setTimeout(flush, 500);
}
let lastSync = 0;
function setSync(st, msg){
  const el = $("sync"); if (st === "ok") lastSync = Date.now();
  if (store.kind === "local") el.textContent = NATIVE ? (st === "err" ? "⚠ Не вдалося зберегти." : "✓ Збережено на цьому пристрої") : st === "err" ? "⚠ Не вдалося зберегти в цьому браузері." : "Дані зберігаються лише в цьому браузері.";
  else el.textContent = st === "pending" ? "Збереження…" : st === "err" ? "⚠ " + msg : "✓ Збережено · синхронізується між пристроями";
}

/* ---------- Програма з App Store (Capacitor): дані — у файлі програми, копія в localStorage ---------- */
const NATIVE = !!(window.Capacitor && (typeof window.Capacitor.isNativePlatform === "function" ? window.Capacitor.isNativePlatform() : location.protocol === "capacitor:"));
const CAPP = {};
function capCall(plugin, method, opts){
  const C = window.Capacitor;
  if (typeof C.registerPlugin === "function"){ const p = CAPP[plugin] || (CAPP[plugin] = C.registerPlugin(plugin)); return p[method](opts || {}); }
  return C.nativePromise(plugin, method, opts || {});
}
const NFILE = { path:"budget/data.json", directory:"LIBRARY" };     // Library: входить у резервну копію iPhone (iCloud)
async function nativeLoad(){ try { const r = await capCall("Filesystem", "readFile", Object.assign({ encoding:"utf8" }, NFILE)); return typeof r.data === "string" && r.data ? r.data : null; } catch(_){ return null; } }
let nativeQ = Promise.resolve(true);
function nativeSave(json){
  nativeQ = nativeQ.then(() => capCall("Filesystem", "writeFile", Object.assign({ data:json, encoding:"utf8", recursive:true }, NFILE)).then(() => true, e => { console.warn("native save", e); return false; }));
  return nativeQ;
}
async function init(){
  if (NATIVE) return startLocal(await nativeLoad());
  let claude = window.claude;
  for (let i = 0; !claude && i < 15; i++){ await new Promise(r => setTimeout(r, 100)); claude = window.claude; }
  let db = null, uid = null;
  if (claude && typeof claude.use === "function"){
    try {
      const [d, u] = await Promise.all([claude.use("db"), claude.use("user")]);
      db = d; uid = u ? await u.id() : null;
    } catch(_){}
  }
  if (db && uid) startDb(db, uid); else startLocal();
}
function startLocal(fileRaw){
  store.kind = "local";
  try {
    let raw = null; try { raw = localStorage.getItem(LS_KEY); } catch(_){}
    raw = raw || fileRaw || null;                                // localStorage новіший; файл — якщо iOS його очистила
    if (raw){ const o = JSON.parse(raw); if (o && o.meta){ rotateBackups(o); S.meta = normMeta(o.meta); S.tx = o.tx || {}; } }
    if (!localInfo().first) localInfo({ first: Date.now() });
  } catch(_){}
  setSync("ok"); boot();
}
function startDb(db, uid){
  store.kind = "db";
  store.metaRef = db.doc("data/users/" + uid + "/budget");
  store.txCol = store.metaRef.collection("tx");
  const loaded = { meta:false, tx:false };
  let booted = false;
  const timer = setTimeout(() => {
    if (!booted) $("view").innerHTML = '<div class="center">Не вдається з\'єднатися зі сховищем.<br><br><button class="btn" id="goLocal">Працювати локально</button></div>';
    const b = $("goLocal"); if (b) b.onclick = () => { booted = true; startLocal(); };
  }, 10000);
  const tryBoot = () => { if (!booted && loaded.meta && loaded.tx){ booted = true; clearTimeout(timer); setSync("ok"); boot(); } else if (booted) refresh(); };
  store.metaRef.onSnapshot(snap => {
    if (!snap.exists && snap.metadata.fromCache) return;
    if (dirty.has("meta") || saving){ loaded.meta = true; return tryBoot(); }
    const next = snap.exists ? normMeta(clone(snap.data())) : null;
    if (canon(next) !== canon(S.meta)){ S.meta = next; remoteChanged("meta"); loaded.meta = true; tryBoot(); }
    else { loaded.meta = true; if (!booted) tryBoot(); }

  const groups = S.meta.groups.filter(g => !g.debts); if (!groups.length) return;

  passive = true;

    if (!has(/^sonstiges$|^різне$|^інше$/i)) (daily || last).cats.push({ id:rid(), name:"Sonstiges", icon:"📦" });
    S.meta.mig = 2; markDirty("meta");

}
function migrate3(){                  // одноразово: категорії для виписки з банку й зарплата наприкінці місяця — на наступний місяць

/* Schulden: Verlauf und Prognose bis zur Tilgung (Auto-Zahlung, sonst Monatsplan bzw. Zieldatum der Tilgungskategorie) */
function debtForecast(){
  const all = S.meta.accounts.filter(a => a.payCat && catById(a.payCat)), accs = all.filter(a => !a.closed);   // geschlossene (getilgte) Schulden zählen nur im Verlauf mit
  if (!accs.length) return null;
  const now = curMonth(), P = compute(now).per, K = { weekly:52/12, biweekly:26/12, monthly:1, quarterly:1/3, yearly:1/12 };
  const ix = {}; all.forEach((a, i) => { ix[a.id] = i; });
  const hist = all.map(() => ({})), paid = all.map(() => 0); let first = now;
  for (const t of allTx()){
    if (t.hist) continue;
    const tm = t.date.slice(0, 7);
    if (t.acc in ix){ const h = hist[ix[t.acc]]; h[tm] = (h[tm] || 0) + t.amt; if (tm < first) first = tm; if (t.to) paid[ix[t.acc]] += t.amt; }
    if (t.to && t.to in ix){ const h = hist[ix[t.to]]; h[tm] = (h[tm] || 0) - t.amt; if (tm < first) first = tm; paid[ix[t.to]] -= t.amt; }
  }
  const debts = accs.map(a => {
    const i = ix[a.id], owed = Math.max(0, -accBalance(a.id)), cat = catById(a.payCat), tg = cat.target, s = debtSched(a.id), paidNow = (P[cat.id] && P[cat.id].paid) || 0;
    let plan = null;
    if (s) plan = { amt: Math.max(1, Math.round(-s.amt * (K[s.freq] || 1))), from: s.next.slice(0, 7) < now ? now : s.next.slice(0, 7), auto:true };
    else if (tg && tg.type === "monthly" && tg.amt) plan = { amt: tg.amt, from: now, first: Math.max(0, tg.amt - paidNow) };
    else if (tg && tg.type === "date" && tg.month) plan = { amt: Math.max(1, Math.ceil(owed / Math.max(1, monthDiff(now, tg.month) + 1))), from: now };
    const pd = Math.max(0, paid[i]);
    return { a, owed, plan, paid: pd, left: owed, end: owed > 0 ? null : now, prog: owed > 0 ? (pd > 0 ? pd / (pd + owed) : 0) : 1 };
  });
  const series = [];
  if (monthDiff(first, now) > 12) first = addMonth(now, -12);
  for (let k = first; k < now; k = addMonth(k, 1)){
    const bal = hist.map(h => { let b = 0; for (const tm in h) if (tm <= k) b += h[tm]; return Math.max(0, -b); });
    series.push({ m:k, v: bal.reduce((s, x) => s + x, 0), fc:false, parts: accs.map(a => bal[ix[a.id]]) });
  }
  series.push({ m: now, v: debts.reduce((s, d) => s + d.owed, 0), fc:false, parts: debts.map(d => d.owed) });
  const nowIdx = series.length - 1, hasPlan = debts.some(d => d.plan && d.owed > 0);
  let long = false;
  if (hasPlan) for (let i = 0; ; i++){
    const k = addMonth(now, i);
    debts.forEach(d => {
      if (d.left <= 0 || !d.plan || k < d.plan.from) return;
      d.left -= Math.min(d.left, i === 0 && d.plan.first != null ? d.plan.first : d.plan.amt);
      if (d.left <= Math.max(5, Math.round(d.plan.amt * .02))) d.left = 0;      // Rest von wenigen Cent gehört zur letzten Rate
      if (d.left <= 0) d.end = k;
    });
    if (i > 0) series.push({ m:k, v: debts.reduce((s, d) => s + d.left, 0), fc:true, parts: debts.map(d => d.left) });
    if (i > 0 && debts.every(d => d.left <= 0 || !d.plan)) break;
    if (i >= 48){ long = true; break; }
  }
  const open = debts.filter(d => d.owed > 0);
  return { debts, series, nowIdx, total: series[nowIdx].v, hasPlan, long, noPlan: open.filter(d => !d.plan).length,
    free: open.length && open.every(d => d.end) ? open.reduce((mx, d) => d.end > mx ? d.end : mx, "") : null };
}

function planRows(owed, plan, extra){       // Tilgung Monat für Monat: [{m, pay, left}] (gleiche Regeln wie debtForecast)
  const now = curMonth(), rows = []; let left = owed;
  for (let i = 0; left > 0 && i < 240; i++){
    const k = addMonth(now, i); if (k < plan.from) continue;
    let pay = Math.min(left, (i === 0 && plan.first != null ? plan.first : plan.amt) + (extra || 0)); left -= pay;
    if (left <= Math.max(5, Math.round(plan.amt * .02))){ pay += left; left = 0; }

  }
  return rows;
}

/* ---------- Berichte: Diagramm-Bausteine (Inline-SVG, ohne Bibliothek) ---------- */
function niceScale(maxCents, want){          // „runde“ Achse; top in Cent, ticks in Euro
  const maxE = Math.max(1, maxCents / 100), raw = maxE / (want || 3), p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, top = Math.ceil(maxE / step - 1e-9) * step, ticks = [];

}

}

  if (vals.filter(v => v).length < 2) return "";
  const w = 60, h = 22, mx = Math.max(...vals), mn = Math.min(...vals), X = i => 4 + i / (vals.length - 1) * (w - 8), Y = v => h - 4 - (v - mn) / ((mx - mn) || 1) * (h - 8);

/* Tempo der Ausgaben: aufgelaufene Summe je Tag, dieser Monat (Akzent) gegen den Vormonat (Kontextgrau) */
function debtChart(F, W){
  const ser = F.series, n = ser.length, ni = F.nowIdx;
  const sc = niceScale(Math.max(100, ...ser.map(p => p.v)), 3), H = 190, mg = [leftPad(sc), 16, 18, 24], pw = W - mg[0] - mg[1], ph = H - mg[2] - mg[3], y0 = mg[2] + ph;
  const X = i => mg[0] + (n > 1 ? i / (n - 1) : .5) * pw, Y = v => mg[2] + ph - v / sc.top * ph, pt = i => X(i).toFixed(1) + "," + Y(ser[i].v).toFixed(1);

  const set = new Set(ms), today = todayStr(), R = { inc:0, spend:0, debt:0, byCat:{}, unc:{ n:0, sum:0 }, payees:{}, mon:{}, bank:{} };
  ms.forEach(m => { R.mon[m] = { inc:0, spend:0, debt:0 }; });
  for (const t of allTx()){
    if (t.sys) continue;
    const tm = t.date.slice(0, 7), here = set.has(tm), fromDebt = debtAcc(t.acc);
    if (here && t.date <= today) [[t.acc, t.amt], [t.to, -t.amt]].forEach(([id, v]) => {            // для звірки з банком: усе, що вже пройшло по грошових рахунках

      if (v > 0){ b.inN++; b.inS += v; } else { b.outN++; b.outS -= v; }
    });
    if (t.to){ if (here && debtAcc(t.to) && !fromDebt){ R.debt -= t.amt; R.mon[tm].debt -= t.amt; } continue; }   // між своїми рахунками — не витрати

    const c = catById(t.cat);
    if (c && c.pay){ R.debt -= t.amt; R.mon[tm].debt -= t.amt; continue; }       // платіж за боргом з історії виписки
    R.spend -= t.amt; R.mon[tm].spend -= t.amt; R.byCat[t.cat] = (R.byCat[t.cat] || 0) - t.amt;

}

    <div class="f"><label>Звідки</label><select id="mFrom"><option value="rta">💰 Готово до розподілу · ${eur(C.rta)}</option>${opts(from0)}</select></div>
    <div class="f"><label>Куди</label><select id="mTo"><option value="rta">💰 Готово до розподілу</option>${opts(!toRta && over ? over.id : "")}</select></div>

      ${t ? "" : '<div class="txr"><i>' + TXI.rep + '</i><div class="b"><label for="tRep">Повторювати</label><select id="tRep">' + (sc ? "" : '<option value="">Ні</option>') + Object.entries(FREQ).map(([k, l]) => '<option value="' + k + '"' + (sc && sc.freq === k ? " selected" : "") + '>' + l + '</option>').join("") + '</select></div></div>'}

          const base = p.available - (t && !t.to && t.cat === c.id && t.date.slice(0, 7) === m ? t.amt : 0);   // beim Bearbeiten den alten Betrag herausrechnen

      if (date > today) hint.textContent = "Майбутня дата: на залишку рахунку з’явиться " + shortDate(date) + ", у бюджеті рахується в " + MONTHS_LOC[+date.slice(5, 7) - 1] + ".";
      if (kind === "out" && acc && acc.payCat && !(c && c.pay)) hint.textContent = "Покупка в борг: цю суму буде зарезервовано з категорії на погашення «" + acc.name + "».";
      if (kind === "xfer"){
        const d = accById(toSel.value);
        if (isDebt(d)){
          if (isNew){
            const p = compute(date.slice(0, 7)).per[d.payCat], owed = Math.max(0, -accBalance(d.id)), have = Math.max(0, p.available), short = Math.max(0, a - have);
            hint.textContent = "«" + d.name + "»: борг " + eur(owed) + (a ? " → після платежу " + eur(Math.max(0, owed - a)) : "") + ". " +

      paintQuick();
    };
    // найчастіші одержувачі (за 4 місяці) — під сумою, щоб тиснути одразу після введення числа
    const paintQuick = () => {
      const cur = q(el,"#tPayee").value.trim(), list = t || kind === "xfer" ? [] : payeeTop(kind === "out");
      q(el,"#tQuick").innerHTML = list.map(p => '<button type="button" data-p="' + esc(p) + '"' + (p === cur ? ' class="on"' : "") + '>' + esc(chipName(p)) + '</button>').join("");

    // Kategorie-Auswahl: Liste nach Gruppen mit dem verfügbaren Betrag, aufgebaut aus denselben Optionen wie das Auswahlfeld
    const paintPick = () => {
      const f = q(el,"#tPickQ").value.trim().toLowerCase(), per = compute((q(el,"#tDate").value || today).slice(0, 7)).per;
      const row = (val, txt) => { const c = catById(val), p = c && !c.pay ? per[c.id] : null;
        return '<button type="button" class="prow' + (val === catSel.value ? " on" : "") + '" data-c="' + esc(val) + '"><span>' + esc(c ? catIcon(c) + " " + c.name : txt) + '</span>' + (p ? '<b class="num' + (p.available < 0 ? " neg" : p.available > 0 ? " pos" : "") + '">' + eur(p.available) + '</b>' : "") + '</button>'; };
      const hit = o => o.value && (!f || o.textContent.toLowerCase().includes(f));
      const often = !f && kind === "out" ? topCats.filter(c => cc[c.id]).slice(0, 4) : [];
      let h = often.length ? '<div class="phd">Часто</div><div class="list">' + often.map(c => row(c.id, c.name)).join("") + '</div>' : "";
      [...catSel.children].forEach(n => {

    };
    const showPick = on => { q(el,"#tPick").hidden = !on; q(el,"#tForm").hidden = on; q(el,".txtop").hidden = on; if (on){ q(el,"#tPickQ").value = ""; paintPick(); } el.scrollTop = 0; };
    const setKind = k => {
      kind = k; [...q(el,"#tKind").children].forEach(b => b.classList.toggle("on", b.dataset.v === k));
      q(el,"#fPayee").hidden = k === "xfer"; q(el,"#fCat").hidden = k === "xfer"; q(el,"#fTo").hidden = k !== "xfer" || payMode;
      q(el,"#lAcc").textContent = k === "xfer" ? "З рахунку" : "Рахунок";
      const cur = catSel.value || v.cat;
      catSel.innerHTML = catOptions(k === "in" ? (cur || "rta") : (cur === "rta" ? "" : cur), k === "in");
      q(el,"#tCats").innerHTML = k === "out" ? topCats.slice(0, 5).map(c => '<button data-c="' + c.id + '">' + catIcon(c) + " " + esc(c.name) + '</button>').join("") : "";
      paintPayees();
      if (k === "xfer" && toSel.value === accSel.value){ const o = [...toSel.options].find(o => o.value !== accSel.value); if (o) toSel.value = o.value; }
      paintCats();

    const applyPayee = () => {
      const pn = q(el,"#tPayee").value.trim(), c = S.meta.payeeCat[pn]; if (c && kind !== "xfer" && (kind === "in" || c !== "rta") && (catById(c) || c === "rta")) catSel.value = c;
      const am = q(el,"#tAmt");
      if (!t && pn && kind !== "xfer" && !parseAmt(am.value)){
        const last = allTx().filter(x => x.payee === pn && !x.to && !x.sys && (kind === "in" ? x.amt > 0 : x.amt < 0)).sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : y.ts - x.ts).slice(0, 2);
        if (last.length === 2 && last[0].amt === last[1].amt){ am.value = amtStr(Math.abs(last[0].amt)); am.dispatchEvent(new Event("input")); am.dataset.auto = "1"; }
      }
      paintCats();
    };
    if (payMode){ q(el,"#tKind").hidden = true; q(el,"#tAgain").hidden = true; }
    if (isNew && preset && preset.rep) repSel.value = preset.rep;

    if (isNew && preset && preset.cat){ catSel.value = preset.cat; paintCats(); }
    q(el,"#tCats").onclick = e => { const b = e.target.closest("button"); if (!b) return; catSel.value = b.dataset.c; paintCats(); };
    q(el,"#tPayees").onclick = e => { const b = e.target.closest("button"); if (!b) return; q(el,"#tPayee").value = b.dataset.p; applyPayee(); paintPayees(); };
    q(el,"#tQuick").onclick = e => {
      const b = e.target.closest("button"); if (!b) return;
      q(el,"#tPayee").value = b.dataset.p; applyPayee(); paintPayees();
      const am = q(el,"#tAmt");                                                 // суму ще не вводили — клавіатура з цифрами лишається
      if (!parseAmt(am.value) || am.dataset.auto){ am.focus(); if (am.dataset.auto) am.select(); }
    };
    { const hd = el.querySelector(".hd"), sv = document.createElement("button");   // «Зберегти» вгорі: видно й над клавіатурою
      sv.type = "button"; sv.className = "mini ok"; sv.textContent = "Зберегти"; sv.onclick = () => q(el,"#tSave").click(); hd.insertBefore(sv, hd.querySelector("[data-x]")); }
    q(el,"#tPayee").addEventListener("change", applyPayee); q(el,"#tPayee").addEventListener("input", paintPayees);

    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { q(el,"#tDate").value = b.dataset.d; info(); });

      setTimeout(() => { const ae = document.activeElement; if (!ae || ae === document.body || ae.id === "kbPrime") am.focus(); }, 80);
    }
    const doSave = again => {
      const a = parseAmt(q(el,"#tAmt").value);
      if (!a || isNaN(a) || a <= 0) return toast("Введіть суму");
      const date = q(el,"#tDate").value || today;
      const n = { acc: accSel.value, memo: q(el,"#tMemo").value.trim() };
      if (kind === "xfer"){
        n.to = toSel.value; if (n.to === n.acc) return toast("Виберіть різні рахунки");

      } else {
        n.cat = catSel.value || null; n.payee = q(el,"#tPayee").value.trim();
        if (kind === "out" && !n.cat) return toast("Виберіть категорію");
        n.amt = kind === "out" ? -a : a;
        const pcat = kind === "out" ? catById(n.cat) : null;
        if (pcat && pcat.pay && accById(pcat.pay)){          // Ausgabe in der Tilgungskategorie = Zahlung an das Schuldenkonto
          if (pcat.pay === n.acc) return toast("Виберіть рахунок, з якого платите");
          n.to = pcat.pay; n.cat = null; n.payee = "";
        }
      }
      const toDebt = n.to && isDebt(accById(n.to)) ? accById(n.to) : null;
      const what = toDebt ? "Платіж за боргом " + eur(a) + " · " + toDebt.name : n.to ? "Переказ " + eur(a) : (n.amt < 0 ? "Витрата " : "Дохід ") + eur(a) + (n.payee ? " · " + n.payee : "");
      const rep = repSel ? repSel.value : "";
      if (sc){
        const cur = S.meta.sched.find(x => x.id === sc.id); if (!cur){ closeSheet(); return refresh(); }
        Object.assign(cur, { amt:n.amt, acc:n.acc, cat:n.cat, payee:n.payee, memo:n.memo, freq:rep || cur.freq, next:date, day:+date.slice(8, 10) });

        markDirty("meta"); note("Змінено регулярний платіж: " + what); closeSheet(); refresh(); return toast("Збережено");

        if (n.to) s.to = n.to;
        S.meta.sched.push(s); markDirty("meta"); note("Регулярний платіж: " + what); closeSheet(); refresh();

      }
      n.id = t ? t.id : rid(); n.ts = t ? t.ts : Date.now(); n.date = date;
      if (t && t.sys) n.sys = t.sys;
      if (t && t.sched) n.sched = t.sched;

      if (isNew && toDebt) coverDebtPayment(n);
      note((t ? "Змінено: " : "") + what);
      closeSheet(); refresh(); toast(t ? "Збережено" : toDebt ? "Платіж записано: " + eur(a) : "Додано " + eur(a));
      if (again) txSheet(null, { kind, acc:n.acc, date });
    };
    q(el,"#tSave").onclick = () => doSave(false);
    if (isNew) q(el,"#tAgain").onclick = () => doSave(true);

  });
}
function schedSheet(){
  const list = S.meta.sched.filter(s => s.next && FREQ[s.freq]).sort((a, b) => a.next < b.next ? -1 : 1);
  openSheet("Регулярні платежі", (list.length
      ? '<div class="list" style="margin-bottom:12px">' + list.map(s => schedRow(s, 'data-sid="' + s.id + '"')).join("") + '</div>'
      : '<p class="muted" style="margin-top:0">Оренда, зарплата, підписки: додайте їх один раз, і програма сама запише транзакцію в потрібний день.</p>') +
    '<button class="btn wide" id="scAdd">＋ Новий регулярний платіж</button>', el => {
    q(el,"#scAdd").onclick = () => txSheet(null, { rep:"monthly" });
    el.querySelectorAll("[data-sid]").forEach(r => r.onclick = () => txSheet(null, null, r.dataset.sid));
  });
}

/* ---------- Kategorie ---------- */
function payDebt(accId, rep){
  const a = accById(accId); if (!a) return;
  const cat = catById(a.payCat), tg = cat && cat.target, p = compute(curMonth()).per[a.payCat], owed = Math.max(0, -accBalance(accId));
  const plan = tg && tg.type === "monthly" && tg.amt ? Math.min(owed, tg.amt) : 0;
  const sug = rep ? plan : p && p.available > 0 ? Math.min(owed, p.available) : plan;
  txSheet(null, { kind:"xfer", to:accId, amt:-sug, pay:true, rep: rep || "" });
}
const debtSched = accId => S.meta.sched.find(s => s.to === accId && s.next && FREQ[s.freq]);
function catSheet(catId){
  const c = catById(catId); if (!c) return;
  const C = compute(S.month), p = C.per[catId];
  const prev = compute(addMonth(S.month, -1)).per[catId];
  const tg = c.target || {}, pay = !!(c.pay && accById(c.pay)), auto = pay ? debtSched(c.pay) : null;
  const chips = [];
  if (p.under > 0) chips.push([pay ? "За планом" : "Для цілі", p.assigned + p.under]);
  if (prev.assigned && prev.assigned !== p.assigned) chips.push(["Як минулого місяця", prev.assigned]);
  if (!pay && prev.activity < 0) chips.push(["Витрачено минулого місяця", -prev.activity]);
  if (p.available < 0) chips.push(["Покрити перевитрату", p.assigned - p.available]);
  if (C.rta > 0) chips.push(["+ увесь залишок", p.assigned + C.rta]);
  if (p.assigned) chips.push([pay ? "Прибрати резерв" : "Прибрати розподіл", 0]);
  const types = pay ? [["","Немає"],["monthly","Щомісяця"],["date","Погасити до"]] : [["","Немає"],["monthly","Щомісяця"],["date","До дати"],["balance","Накопичити"]];
  const mon = MONTHS_LOC[+S.month.slice(5,7)-1] + " " + S.month.slice(0,4);
  openSheet(catIcon(c) + " " + c.name, `
    <div class="stats num">${pay
      ? '<div><small>Борг</small><b style="color:' + (p.debt ? "var(--neg)" : "var(--pos)") + '">' + eur(p.debt) + '</b></div><div><small>Сплачено за місяць</small>' + eur(p.paid || 0) + '</div><div><small>Зарезервовано</small><b>' + eur(p.available) + '</b></div>'
      : '<div><small>На початок</small>' + eur(p.start) + '</div><div><small>Витрачено</small>' + eur(p.activity) + '</div><div><small>Доступно</small><b style="color:' + (p.available < 0 ? "var(--neg)" : "var(--pos)") + '">' + eur(p.available) + '</b></div>'}</div>
    ${pay ? '<p class="muted" style="font-size:12.5px;margin:-4px 2px 12px">«Зарезервовано» — це гроші, відкладені в бюджеті на цей борг. Це ще не платіж: він з’явиться в транзакціях, коли ви натиснете «Записати платіж».</p>' +
      '<div class="row" style="margin-bottom:' + (auto ? 6 : 14) + 'px"><button class="btn" id="cPay">Записати платіж</button><button class="btn sec" id="cAuto">🔁 ' + (auto ? "Змінити автоплатіж" : "Автоплатіж") + '</button></div>' +
      (auto ? '<p class="muted" style="font-size:12.5px;margin:0 2px 14px">Автоплатіж: ' + eur(-auto.amt) + ", " + FREQ[auto.freq].toLowerCase() + ", наступний " + shortDate(auto.next) + '.</p>' : "") : ""}
    <div class="f"><label>${pay ? "Зарезервувати в бюджеті в " + mon : "Розподілено в " + mon}</label>
      <div class="row"><input type="text" id="cAsg" class="num" inputmode="decimal" value="${amtStr(p.assigned)}" placeholder="0,00"><button class="btn" style="flex:none" id="cAsgOk">OK</button></div></div>
    ${chips.length ? '<div class="chips">' + chips.map(([l, cv], i) => '<button data-i="' + i + '">' + esc(l) + ': ' + eur(cv) + '</button>').join("") + '</div>' : ""}
    <div class="row"><button class="btn sec" id="cMove">⇄ Перемістити гроші</button><button class="btn sec" id="cTx">☰ ${pay ? "Платежі" : "Транзакції"}</button></div>
    <div class="sep"></div>
    <h3>${pay ? "План погашення" : "Ціль"}</h3>
    <div class="seg" id="gType">${types.map(([tv, l]) => '<button data-v="' + tv + '">' + l + '</button>').join("")}</div>
    <div id="gBox">
      <div class="row"><div class="f" id="gAmtF"><label id="gAmtL">Сума, €</label><input type="text" id="gAmt" inputmode="decimal" value="${pay && tg.type === "date" ? "" : amtStr(tg.amt)}"></div>
      <div class="f" id="gMonthF"><label>До місяця</label><input type="month" id="gMonth" value="${tg.month || addMonth(S.month, 6)}"></div></div>
      <label class="chk" id="gOptF"><input type="checkbox" id="gOpt"><span id="gOptL"></span></label>
      <p class="muted" id="gNote" style="font-size:12.5px;margin:0 0 12px"></p>
    </div>
    <button class="btn sec wide" id="gSave">${pay ? "Зберегти план" : "Зберегти ціль"}</button>`, el => {
    const applyAsg = cents => {
      if (isNaN(cents) || cents < 0) return toast("Перевірте суму");

      note((cents ? (pay ? "Зарезервовано " : "Розподілено ") + eur(cents) : "Прибрано розподіл") + " · " + c.name);

/* «Почати спочатку»: історія до 1-го числа цього місяця зникає, залишки на цю дату стають стартовими.
   Поточний і майбутні місяці (платежі, зарплата, розподіл) лишаються як є, тому плани боргів не збиваються. */
function freshStart(){
  const m0 = curMonth(), d0 = m0 + "-01", bal = {}, ts = Date.now();
  for (const t of allTx()){ if (t.hist || t.date >= d0) continue; bal[t.acc] = (bal[t.acc] || 0) + t.amt; if (t.to) bal[t.to] = (bal[t.to] || 0) - t.amt; }
  const tx = {};
  for (const k in S.tx) if (k >= m0 && S.tx[k].length) tx[k] = clone(S.tx[k]);
  const starts = S.meta.accounts.filter(a => bal[a.id]).map(a => {
    const d = debtAcc(a.id);
    return { id:rid(), ts, date:d0, amt:bal[a.id], acc:a.id, cat: d ? null : "rta", payee: d ? "Початковий борг" : "Початковий баланс", memo:"", sys:"start" };
  });
  tx[m0] = starts.concat(tx[m0] || []);
  const meta = clone(S.meta); for (const k in meta.assigned) if (k < m0) delete meta.assigned[k];
  loadState({ meta, tx }, "Почато спочатку з " + dayMon(d0) + m0.slice(0, 4));
}
function freshSheet(){
  const m0 = curMonth(), d0 = m0 + "-01", old = allTx().filter(t => t.date < d0).length, mons = Object.keys(S.meta.assigned).filter(k => k < m0).length, when = dayMon(d0) + m0.slice(0, 4);
  if (!old && !mons) return openSheet("Почати спочатку", '<p>Старої історії немає: усе вже починається з ' + when + '</p><button class="btn sec wide" data-x>Зрозуміло</button>');
  openSheet("Почати спочатку", `
    <p style="margin-top:2px">Бюджет почнеться з ${when}: залишки рахунків і боргів на цю дату стануть стартовими. Так зникнуть старі помилки й плутанина в історії.</p>
    <div class="card"><div class="kv"><span>Залишиться</span><b>рахунки, борги, категорії, цілі, регулярні платежі, усі операції з ${when}</b></div>
      <div class="kv"><span>Зникне</span><b>${old} ${plural(old, "операція", "операції", "операцій")} до ${when}${mons ? " і розподіл за " + mons + " міс." : ""}</b></div></div>
    <p class="muted" style="font-size:13px">Гроші, що лишалися в категоріях з минулих місяців, повернуться в «Готово до розподілу». Скасувати можна кнопкою ↩︎, поки програма відкрита. Радимо спершу зберегти резервну копію.</p>
    <div class="row"><button class="btn sec" id="fsBak">Зберегти копію</button><button class="btn danger" id="fsGo">Почати спочатку</button></div>`, el => {
    q(el, "#fsBak").onclick = exportBackup;
    q(el, "#fsGo").onclick = () => { closeSheet(); freshStart(); };
