<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мій бюджет</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#08090c; --card:#15171c; --card2:#1d2027; --text:#f5f6f8; --muted:#8b92a1; --line:rgba(255,255,255,.07); --soft:#22252d;
  --accent:#4f7cff; --accent2:#9b5cff; --accent-soft:rgba(79,124,255,.16);
  --pos:#2fd480; --pos-soft:rgba(47,212,128,.14); --neg:#ff5a5f; --neg-soft:rgba(255,90,95,.15); --warn:#ffb547; --warn-soft:rgba(255,181,71,.15);
  --r:22px;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font:15px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px;position:relative}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

/* Hintergrund-Glow */
.glow{position:absolute;left:-30%;right:-30%;top:-120px;height:520px;z-index:0;pointer-events:none;
  background:radial-gradient(45% 50% at 30% 40%, rgba(79,124,255,.55), transparent 70%),radial-gradient(40% 45% at 75% 30%, rgba(155,92,255,.45), transparent 70%),radial-gradient(35% 35% at 55% 70%, rgba(47,212,200,.18), transparent 70%);filter:blur(10px)}
.glow.small{height:300px;opacity:.6}
main,.top,.sync{position:relative;z-index:1}

/* Kopfzeile */
.top{display:flex;align-items:center;gap:10px;padding:14px 0 6px}
.top h1{font-size:26px;font-weight:750;margin:0;flex:1;letter-spacing:-.02em}
.iconbtn{border:0;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:50%;width:40px;height:40px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.sp{flex:1}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 4px;min-height:14px}

/* Hero */
.hero{text-align:center;padding:18px 0 8px}
.mpill{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:3px;font-size:13.5px;font-weight:600}
.mpill button{border:0;background:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:17px;color:var(--text)}
.mpill span{padding:0 6px;min-width:120px}
.hero .lbl{font-size:13.5px;color:rgba(255,255,255,.75);margin-top:16px}
.hero .amount{font-size:44px;font-weight:750;letter-spacing:-.03em;margin:2px 0 4px;line-height:1.1}
.hero .amount .c{font-size:26px;opacity:.85}
.hero .amount.neg{color:var(--neg)}
.hero .sub{font-size:13px;color:rgba(255,255,255,.7)}
.badge{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12)}
.badge.pos{background:var(--pos-soft);color:var(--pos)} .badge.neg{background:var(--neg-soft);color:var(--neg)}
.actions{display:flex;justify-content:center;gap:18px;margin:20px 0 22px}
.act{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;font-size:12px;color:var(--text);width:68px}
.act i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;font-style:normal}
.act i svg{width:22px;height:22px}
.act.on i{background:var(--text);color:var(--bg)}
.act:disabled{opacity:.4}

/* Karten & Listen */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.sec-h{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;cursor:pointer}
.sec-h .n{flex:1;font-size:15px;font-weight:700}
.sec-h .s{font-size:13.5px;color:var(--muted);font-weight:500}
.sec-h .chev{color:var(--muted);transition:transform .2s;font-size:12px}
.sec-h.col .chev{transform:rotate(-90deg)}
.list{background:var(--card);border-radius:var(--r);overflow:hidden}
.row-i{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;position:relative}
.row-i + .row-i::before{content:"";position:absolute;left:66px;right:14px;top:0;height:1px;background:var(--line)}
.row-i:active{background:rgba(255,255,255,.03)}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;position:relative}
.av svg{width:20px;height:20px}
.av .ring{position:absolute;inset:-3px;border-radius:50%;-webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));mask:radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px))}
.row-i .m{flex:1;min-width:0}
.row-i .t{font-weight:600;font-size:15px;overflow-wrap:anywhere}
.row-i .st{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-i .st.w{white-space:normal}
.row-i .r{text-align:right;flex:none}
.row-i .r .v{font-weight:650;font-size:15px}
.row-i .r .st{margin-top:1px}
.v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.warn{color:var(--warn)} .v.zero{color:var(--muted)}
.hidden-cat{opacity:.45}
.ed{display:flex;gap:6px}
.mini{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.mini:disabled{opacity:.3}
.edit-row{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;display:flex;align-items:center;gap:10px}

/* Buttons */
.btn{border:0;background:var(--accent);color:#fff;font-weight:650;border-radius:999px;padding:12px 18px;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--text)}
.btn.danger{background:var(--neg-soft);color:var(--neg)}
.btn.small{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.45}
.btn.wide{width:100%;padding:15px;font-size:16px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 12px;font-size:13px;border:0;cursor:pointer;font-weight:600}

/* Transaktionen */
.filters{display:flex;gap:8px;margin:6px 0 10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border-radius:999px;padding:0 14px}
.search svg{width:18px;height:18px;color:var(--muted);flex:none}
.search input{border:0!important;background:none!important;padding:11px 0!important}
.filters select{width:auto!important;border-radius:999px!important;background:var(--card)!important;border:0!important;padding:11px 14px!important;font-size:14px!important}
.day{font-size:13.5px;color:var(--muted);font-weight:600;margin:16px 6px 8px}
.amt{font-weight:650}
.amt.in{color:var(--pos)}

/* Konten / Berichte */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:18px;padding:14px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;margin-top:3px}
.hb{margin:12px 0}
.hb .r{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;gap:8px}
.hb .b{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hb .b i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px}
.mrow{display:grid;grid-template-columns:56px 1fr 96px;gap:10px;align-items:center;font-size:13px;margin:10px 0}
.mrow .bars{display:flex;flex-direction:column;gap:4px}
.mrow .bars i{display:block;height:7px;border-radius:4px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--c)}
h3{font-size:16px;margin:0 0 10px;font-weight:700}

/* Navigation unten */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;width:calc(100% - 28px);max-width:420px;background:rgba(30,32,38,.82);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06)}
.nav .in{display:flex;padding:6px}
.nav button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:11px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:999px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--text);background:rgba(255,255,255,.08);font-weight:600}
.fab{position:fixed;right:max(18px, calc(50% - 262px));bottom:calc(92px + env(safe-area-inset-bottom));z-index:31;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 24px rgba(79,124,255,.45);cursor:pointer;display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}

/* Bottom-Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.2);margin:0 auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sheet .hd{display:flex;align-items:center;margin-bottom:14px;gap:10px}
.sheet .hd b{flex:1;font-size:19px;font-weight:700}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:6px}
input[type=text],input[type=date],input[type=number],input[type=month],select{width:100%;font:inherit;font-size:16px;padding:13px 14px;border:0;border-radius:14px;background:var(--soft);color:var(--text);outline:none}
input:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
input.amtin{font-size:38px;font-weight:750;text-align:center;padding:14px;background:none;letter-spacing:-.02em}
input.amtin:focus{box-shadow:none}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.row{display:flex;gap:10px}
.row > *{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{background:var(--soft);border-radius:16px;padding:10px;text-align:center;font-weight:650}
.stats small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-bottom:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:600}
.sep{height:1px;background:var(--line);margin:16px 0}
.help p{margin:0 0 10px}
.help b{color:var(--accent)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
.emojis button{border:0;background:var(--soft);border-radius:12px;aspect-ratio:1;font-size:20px;cursor:pointer}
.emojis button.on{box-shadow:0 0 0 2px var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#f5f6f8;color:#111;padding:11px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;opacity:0;transition:all .2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.on{opacity:1;transform:translateX(-50%)}
.center{text-align:center;padding:60px 10px;color:var(--muted)}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:14px}
[hidden]{display:none!important}


/* Fortschrittsbalken, Schnellauswahl, Hinweise */
.pb{height:4px;border-radius:2px;background:var(--soft);margin-top:6px;overflow:hidden;max-width:230px}
.pb i{display:block;height:100%;border-radius:2px;background:var(--pos)}
.pb.warn i{background:var(--warn)} .pb.neg i{background:var(--neg)}
.qrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.qrow:empty{display:none}
.qrow button{border:0;background:var(--soft);color:var(--text);border-radius:999px;padding:7px 11px;font-size:13.5px;cursor:pointer;white-space:nowrap}
.qrow button.on{background:var(--accent);color:#fff}
.info{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.info:empty{display:none}
.info.neg{color:var(--neg);font-weight:600}
#tHint{margin:-6px 2px 12px}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;margin:-2px 2px 12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.big{font-size:28px;font-weight:750;letter-spacing:-.02em}
.st2{font-size:12.5px;color:var(--warn);margin-top:5px}
.hb[data-act]{cursor:pointer}
.nav .add{flex:0 0 62px;padding:0;justify-content:center;background:none!important}
.nav .add span{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(79,124,255,.4)}
.nav .add svg{width:24px;height:24px}
.toast{top:calc(60px + env(safe-area-inset-top));bottom:auto;transform:translateX(-50%) translateY(-10px);display:flex;align-items:center;gap:12px;width:max-content;border-radius:18px}
.toast.on{transform:translateX(-50%)}
.toast.on.wbtn{pointer-events:auto}
.toast.low,body.apple .toast.low{top:auto;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px)}
.toast.low.on,body.apple .toast.low.on{transform:translateX(-50%)}
.toast button{border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:10px 8px;margin:-10px -8px -10px 0;cursor:pointer;white-space:nowrap;flex:none}
.tip{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.35}
.tip .tt{flex:1}
.tip.neg{background:var(--neg-soft)} .tip.warn{background:var(--warn-soft)}
.tip .btn{flex:none}
.tip .tb{display:flex;flex-direction:column;gap:6px;flex:none}
.sheet{max-height:92dvh}
.filters select{font-size:16px!important}
.act{white-space:nowrap}
body:not(.apple) .actions{gap:12px}
body:not(.apple) .act{width:76px}

/* ===================== Apple-/iOS-Stil ===================== */
.only-apple{display:none!important}
body.apple .only-apple{display:flex!important}
body:not(.apple) .neo-hide{visibility:hidden}
body.apple{
  --bg:#f2f2f7; --card:#fff; --card2:#fff; --text:#000; --muted:rgba(60,60,67,.6); --line:rgba(60,60,67,.29); --soft:rgba(118,118,128,.12);
  --accent:#007aff; --accent2:#007aff; --accent-soft:rgba(0,122,255,.12);
  --pos:#34c759; --pos-soft:rgba(52,199,89,.15); --neg:#ff3b30; --neg-soft:rgba(255,59,48,.12); --warn:#ff9500; --warn-soft:rgba(255,149,0,.15);
  --segon:#fff; --segtxt:#000; --tabbar:rgba(249,249,249,.88); --r:12px;
  color-scheme:light; background:var(--bg); min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif; letter-spacing:-.01em;
}
@media (prefers-color-scheme: dark){
  body.apple{ --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --text:#fff; --muted:rgba(235,235,245,.6); --line:rgba(84,84,88,.65); --soft:rgba(118,118,128,.24);
    --accent:#0a84ff; --accent2:#0a84ff; --accent-soft:rgba(10,132,255,.2); --pos:#30d158; --pos-soft:rgba(48,209,88,.18); --neg:#ff453a; --neg-soft:rgba(255,69,58,.2); --warn:#ff9f0a; --warn-soft:rgba(255,159,10,.2);
    --segon:#636366; --segtxt:#fff; --tabbar:rgba(22,22,24,.88); color-scheme:dark; }
}
html:has(body.apple){background:#f2f2f7}
@media (prefers-color-scheme: dark){ html:has(body.apple){background:#000} }
body.apple .glow{display:none}
body.apple .wrap{padding:0 16px 100px}
body.apple .top{padding:10px 0 2px}
body.apple .top h1{font-size:34px;font-weight:700;letter-spacing:.005em}
body.apple .iconbtn{background:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--accent);width:34px;height:34px}
body.apple .iconbtn svg{width:25px;height:25px}
body.apple .sync{text-align:left;margin:0 0 6px}
/* Kopfkarte */
body.apple .hero{text-align:left;background:var(--card);border-radius:var(--r);padding:12px 16px 16px;margin:4px 0 12px}
body.apple .mpill{display:flex;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0;margin:0 -8px;justify-content:space-between}
body.apple .mpill span{flex:1;text-align:center;font-size:15px;font-weight:600;min-width:0}
body.apple .mpill button{color:var(--accent);font-size:26px;font-weight:300;width:34px}
body.apple .hero .lbl{color:var(--muted);font-size:13px;margin-top:12px}
body.apple .hero .amount{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:0}
body.apple .hero .amount .c{font-size:24px;opacity:.55}
body.apple .hero .sub{color:var(--muted);font-size:13px}
body.apple .badge{margin-top:10px;border-radius:7px;padding:4px 9px;background:var(--accent-soft);color:var(--accent)}
body.apple .badge.pos{background:var(--pos-soft);color:var(--pos)} body.apple .badge.neg{background:var(--neg-soft);color:var(--neg)}
body.apple .actions{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin:0 0 4px}
body.apple .act{width:auto;background:var(--card);border-radius:var(--r);padding:12px 4px 10px;gap:5px;font-size:12px;font-weight:500}
body.apple .act i{width:auto;height:auto;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--accent)}
body.apple .act i svg{width:25px;height:25px}
body.apple .act.on{background:var(--accent);color:#fff} body.apple .act.on i{color:#fff;background:none}
/* Listen im Stil „Inset Grouped“ */
body.apple .sec-h{margin:24px 16px 7px}
body.apple .sec-h .n{font-size:13px;font-weight:400;text-transform:uppercase;color:var(--muted);letter-spacing:.01em}
body.apple .sec-h .s{font-size:13px}
body.apple .sec-h .chev{font-size:10px}
body.apple .list{border-radius:var(--r)}
body.apple .row-i{padding:9px 16px;gap:14px;min-height:52px}
body.apple .row-i + .row-i::before{left:62px;right:0;height:1px;transform:scaleY(.5);background:var(--line)}
body.apple .row-i:active{background:var(--soft)}
body.apple .av{width:32px;height:32px;border-radius:8px;font-size:17px;background:var(--c)!important;color:#fff!important}
body.apple .av svg{width:18px;height:18px}
body.apple .av .ring{display:none}
body.apple .row-i .t{font-size:16px;font-weight:400;letter-spacing:-.02em}
body.apple .row-i .st{font-size:13px}
body.apple .row-i .r .v{font-size:16px;font-weight:500}

<script>
(function(){

const MONTHS_GEN = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
const MONTHS_LOC = ["січні","лютому","березні","квітні","травні","червні","липні","серпні","вересні","жовтні","листопаді","грудні"];
const MSHORT = ["січ","лют","бер","кві","тра","чер","лип","сер","вер","жов","лис","гру"];
const WD = ["нд","пн","вт","ср","чт","пт","сб"];
const pad2 = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); };
const curMonth = () => todayStr().slice(0, 7);
const addMonth = (m, k) => { let y = +m.slice(0,4), mo = +m.slice(5,7) - 1 + k; y += Math.floor(mo / 12); mo = ((mo % 12) + 12) % 12; return y + "-" + pad2(mo + 1); };
const monthDiff = (a, b) => (+b.slice(0,4) - +a.slice(0,4)) * 12 + (+b.slice(5,7) - +a.slice(5,7));

const dayLabel = d => { const dt = new Date(d + "T12:00:00"); return dt.getDate() + " " + MONTHS_GEN[dt.getMonth()] + (d.slice(0,4) !== todayStr().slice(0,4) ? " " + d.slice(0,4) : "") + ", " + WD[dt.getDay()]; };

  if (str == null) return NaN;

const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return dstr(d); };
const daysIn = m => new Date(+m.slice(0,4), +m.slice(5,7), 0).getDate();

   ===================================================================== */
const S = { meta:null, tx:{}, tab:"budget", month:curMonth(), edit:false, collapsed:{}, accFilter:"", catFilter:"", search:"", txLimit:150 };
const ACC_TYPES = { checking:"Поточний", savings:"Ощадний", cash:"Готівка", credit:"Кредитна картка", debt:"Борг / розстрочка (Klarna, кредит)" };
const TEMPLATES = {
  std: [
    ["Обов'язкові", ["Оренда","Комунальні послуги","Інтернет і мобільний","Страхування","Транспорт"]],
    ["Щоденні витрати", ["Продукти","Кафе та доставка","Побутові товари","Одяг","Здоров'я та аптека"]],
    ["Нерегулярні витрати", ["Подарунки","Техніка та ремонт","Річні платежі","Навчання"]],
    ["Цілі та накопичення", ["Подушка безпеки","Внесок на житло","Відпустка","Інвестиції"]],
    ["Задоволення", ["Розваги","Підписки","Хобі"]]
  ],
  empty: [["Мої категорії", ["Продукти","Оренда"]]]
};
function newMeta(tpl){
  return { v:1, accounts:[], assigned:{}, payeeCat:{}, sched:[],
    groups: TEMPLATES[tpl].map(([g, cs]) => ({ id:rid(), name:g, cats: cs.map(n => ({ id:rid(), name:n })) })) };

function normMeta(m){
  m.accounts = m.accounts || []; m.groups = m.groups || []; m.assigned = m.assigned || {}; m.payeeCat = m.payeeCat || {}; m.sched = m.sched || [];

const allCats = () => S.meta.groups.flatMap(g => g.cats);
const catById = id => allCats().find(c => c.id === id);
const accById = id => S.meta.accounts.find(a => a.id === id);
const allTx = () => Object.values(S.tx).flat();
function findTx(id){ for (const k in S.tx){ const i = S.tx[k].findIndex(t => t.id === id); if (i >= 0) return { k, i, t:S.tx[k][i] }; } return null; }

  const old = findTx(t.id);

  const a = S.meta.assigned[m] = S.meta.assigned[m] || {};

const FREQ = { weekly:"Щотижня", biweekly:"Кожні 2 тижні", monthly:"Щомісяця", quarterly:"Щокварталу", yearly:"Щороку" };

  if (s.freq === "weekly") return addDays(s.next, 7);
  if (s.freq === "biweekly") return addDays(s.next, 14);

/* Fällige Buchungen eintragen. Feste IDs (Plan + Datum) verhindern Dubletten, wenn zwei Geräte gleichzeitig buchen. */
function runScheduled(){
  const list = S.meta && S.meta.sched; if (!list || !list.length) return 0;
  const today = todayStr(), done = []; let n = 0, changed = false;

            let amt = s.amt, last = false;
            if (debt){                                 // Rate an ein Schuldenkonto: nie mehr als die Restschuld, danach endet der Plan
              const owed = Math.max(0, -accBalance(debt.id));
              if (owed <= 0){ done.push(s.id); changed = true; break; }
              if (-amt >= owed){ amt = -owed; last = true; }
            }
            const t = { id, ts:Date.now(), date:s.next, amt, acc:s.acc, cat:s.to ? null : (s.cat || null), payee:s.to ? "" : (s.payee || ""), memo:s.memo || "", sched:s.id };
            if (s.to) t.to = s.to;
            putTx(t); n++;
            if (debt) coverDebtPayment(t);
            if (last){ done.push(s.id); changed = true; break; }
          }
        }
        s.next = schedNext(s); changed = true;
      }
    }
    if (done.length) S.meta.sched = S.meta.sched.filter(s => !done.includes(s.id));

/* Zahlung an ein Schuldenkonto: reicht das Zurückgelegte nicht, wird der Rest aus „Bereit zum Zuweisen“ zugewiesen */
function coverDebtPayment(t){
  const d = accById(t.to); if (!d || !d.payCat || !catById(d.payCat)) return 0;
  const m = t.date.slice(0, 7), p = compute(m).per[d.payCat];
  if (p.available >= 0) return 0;
  setAssigned(m, d.payCat, p.assigned - p.available);

}

/* =====================================================================
   Budget-Rechnung (Methode: jeder Euro bekommt eine Aufgabe)
   - Verfügbar = positiver Übertrag + Zugewiesen + Aktivität
   - Überzogene Kategorien werden im Folgemonat auf 0 gesetzt, der Betrag
     wird von „Готово до розподілу“ abgezogen
   - Zuweisungen in künftigen Monaten mindern das aktuelle „Готово“
   ===================================================================== */
function compute(view){
  const catsAll = allCats(), cats = catsAll.map(c => c.id);
  // Schuldenkonten (Klarna, Kredit, Kreditkarte): Konto -> Tilgungskategorie
  const payOf = {};
  S.meta.accounts.forEach(a => { if (a.payCat && cats.includes(a.payCat)) payOf[a.id] = a.payCat; });
  const inc = {}, act = {}, real = {}, owed = {}, paid = {};
  const addAct = (m, c, v) => { const o = act[m] = act[m] || {}; o[c] = (o[c] || 0) + v; };
  let minM = view;
  for (const t of allTx()){
    const m = t.date.slice(0, 7);
    if (m < minM) minM = m;
    const pa = payOf[t.acc], pt = t.to ? payOf[t.to] : null;
    if (m <= view){ if (pa) owed[t.acc] = (owed[t.acc] || 0) - t.amt; if (pt) owed[t.to] = (owed[t.to] || 0) + t.amt; }
    if (pt && m === view) paid[t.to] = (paid[t.to] || 0) - t.amt;
    if (t.to){                                   // Überweisung: Zahlung an ein Schuldenkonto kommt aus dessen Tilgungskategorie
      if (pa) addAct(m, pa, -t.amt);
      if (pt) addAct(m, pt, t.amt);
      continue;
    }
    if (pa){                                     // Kauf auf Pump: Geld wandert aus der Kategorie in die Tilgungskategorie
      if (!t.cat) continue;                      // Anfangsschuld / Korrektur: nur die Schuld ändert sich
      addAct(m, pa, -t.amt);
    }
    if (t.cat === "rta"){ inc[m] = (inc[m] || 0) + t.amt; if (!t.sys && !pa) real[m] = (real[m] || 0) + t.amt; }
    else if (t.cat) addAct(m, t.cat, t.amt);
  }
  for (const m in S.meta.assigned) if (m < minM) minM = m;
  let rta = 0, over = 0; const carry = {};
  let per = {};
  for (let m = minM; m <= view; m = addMonth(m, 1)){
    const asg = S.meta.assigned[m] || {};
    let asgSum = 0; for (const k in asg) asgSum += asg[k];
    rta += (inc[m] || 0) - asgSum - over;
    over = 0; per = {};
    for (const c of cats){
      const start = Math.max(0, carry[c] || 0), a = asg[c] || 0, ac = (act[m] || {})[c] || 0, av = start + a + ac;
      per[c] = { start, assigned:a, activity:ac, available:av };
      carry[c] = av; if (av < 0) over += -av;
    }
  }
  let fut = 0;
  for (const m in S.meta.assigned) if (m > view) for (const k in S.meta.assigned[m]) fut += S.meta.assigned[m][k];
  for (const c of cats) if (!per[c]) per[c] = { start:0, assigned:0, activity:0, available:0 };
  // Zielberechnung
  for (const c of catsAll){
    const p = per[c.id], tg = c.target; p.need = 0; p.under = 0; p.prog = null;
    if (c.pay){
      const o = Math.max(0, owed[c.pay] || 0); p.debt = o; p.paid = paid[c.pay] || 0;
      const uncovered = Math.max(0, o - (p.available - p.assigned));
      if (tg && tg.type === "monthly" && tg.amt) p.need = Math.min(tg.amt, uncovered);
      else if (tg && tg.type === "date") p.need = Math.ceil(uncovered / Math.max(1, monthDiff(view, tg.month || view) + 1));
      p.under = Math.max(0, p.need - p.assigned);
      p.prog = o > 0 ? clamp01(p.available / o) : null;
      continue;
    }
    if (!tg || !tg.amt) continue;
    if (tg.type === "monthly"){
      p.need = tg.refill ? Math.max(0, tg.amt - p.start) : tg.amt;
      p.under = Math.max(0, p.need - p.assigned);
      p.prog = clamp01((tg.refill ? p.start + p.assigned : p.assigned) / tg.amt);
    } else if (tg.type === "date"){
      let due = tg.month || view;
      if (tg.repeat) while (due < view) due = addMonth(due, 12);
      p.due = due; p.prog = clamp01(p.available / tg.amt);
      if (due < view){ p.expired = true; continue; }
      p.need = Math.max(0, Math.ceil((tg.amt - p.start) / (monthDiff(view, due) + 1)));
      p.under = Math.max(0, p.need - p.assigned);
    } else if (tg.type === "balance"){
      p.prog = clamp01(p.available / tg.amt);
    }
  }
  const income = real[view] || 0;
  return { per, rta: rta - fut, income, minM, owed };
}
function accBalance(id){
  let b = 0;
  for (const t of allTx()){ if (t.acc === id) b += t.amt; if (t.to === id) b -= t.amt; }
  return b;
}

   Speicher: Claude-db (privat pro Nutzer) mit Fallback localStorage

const LS_KEY = "budget-app-v1", APP_VER = "2026-11-13.3";
const store = { kind:null, metaRef:null, txCol:null };
const dirty = new Set(); let saveTimer = null, saving = false, fatal = false;
/* ---------- Rückgängig / Wiederholen ----------
   Alle Änderungen einer Benutzeraktion (ein Tick) bilden einen Eintrag: gemerkt wird der Stand der
   geänderten Dokumente VOR der Aktion. Automatische Buchungen (passive) eröffnen keinen eigenen Eintrag. */
const UNDO_MAX = 25, undoStack = [], redoStack = [];
let committed = { meta:null, tx:{} }, undoPending = null, undoOff = false, passive = false, persistAsked = false;
const snapKey = k => { if (k === "meta") return clone(committed.meta); const a = committed.tx[k]; return a && a.length ? clone(a) : null; };
const liveKey = k => k === "meta" ? clone(S.meta) : (S.tx[k] && S.tx[k].length ? clone(S.tx[k]) : null);
function syncCommitted(){ committed = { meta: clone(S.meta), tx: clone(S.tx) }; }
function commitKey(k){ if (k === "meta") committed.meta = clone(S.meta); else if (S.tx[k] && S.tx[k].length) committed.tx[k] = clone(S.tx[k]); else delete committed.tx[k]; }
function markDirty(k){
  if (!undoOff && committed.meta){
    if (!undoPending){ undoPending = { label:"", time:Date.now(), keys:{}, silent:passive }; setTimeout(commitUndo, 0); }
    else if (!passive) undoPending.silent = false;
    if (!(k in undoPending.keys)) undoPending.keys[k] = snapKey(k);
  }
  if (!persistAsked && store.kind === "local"){ persistAsked = true; try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(_){} }
  dirty.add(k); clearTimeout(saveTimer); saveTimer = setTimeout(flush, store.kind === "local" ? 0 : 500); setSync("pending");
}
function note(label){ if (undoPending){ undoPending.label = label; undoPending.locked = true; } }
function commitUndo(){
  const u = undoPending; undoPending = null; if (!u) return;
  let changed = false;
  for (const k of Object.keys(u.keys)){
    if (JSON.stringify(liveKey(k)) === JSON.stringify(u.keys[k])) delete u.keys[k]; else changed = true;
    commitKey(k);
  }
  if (changed && !u.silent){
    if (!u.label) u.label = "Зміна";
    undoStack.push(u); if (undoStack.length > UNDO_MAX) undoStack.shift();
    redoStack.length = 0;
  }

}
function paintUndo(){ const b = $("undoBtn"); if (b) b.hidden = !(undoStack.length || redoStack.length); }
function applyEntry(u){            // stellt den Stand aus u.keys her und liefert den Gegen-Eintrag
  const back = { label:u.label, time:Date.now(), keys:{} };
  undoOff = true;
  try {
    for (const k of Object.keys(u.keys)){
      back.keys[k] = liveKey(k);
      if (k === "meta") S.meta = normMeta(clone(u.keys[k])); else S.tx[k] = u.keys[k] ? clone(u.keys[k]) : [];
      markDirty(k); commitKey(k);

}
function undoLast(){
  if (undoPending) commitUndo();
  const u = undoStack.pop(); if (!u) return toast("Немає дій для скасування");
  redoStack.push(applyEntry(u));
  closeSheet(); refresh(); toast("Скасовано: " + u.label, { label:"Повернути", fn: redoLast });
}
function redoLast(){
  if (undoPending) commitUndo();
  const u = redoStack.pop(); if (!u) return;
  undoStack.push(applyEntry(u));
  closeSheet(); refresh(); toast("Повернуто: " + u.label, { label:"Скасувати", fn: undoLast });
}
function undoEntry(u){
  if (undoPending) commitUndo();
  if (undoStack[undoStack.length - 1] === u) undoLast(); else if (undoStack.includes(u)) historySheet();
}
function remoteChanged(k){          // Änderung von einem anderen Gerät: Einträge für dieses Dokument sind nicht mehr gültig
  commitKey(k);
  for (const st of [undoStack, redoStack]) for (let i = st.length - 1; i >= 0; i--) if (k in st[i].keys) st.splice(i, 1);

/* ---------- Gerätebezogene Notizen und Autokopien (nur lokaler Speicher) ---------- */
const LS_BAK = LS_KEY + "-bak", LS_INFO = LS_KEY + "-info";
function localInfo(patch){
  let o = {}; try { o = JSON.parse(localStorage.getItem(LS_INFO) || "{}") || {}; } catch(_){}
  if (patch){ Object.assign(o, patch); try { localStorage.setItem(LS_INFO, JSON.stringify(o)); } catch(_){} }
  return o;
}
function readBackups(){ try { const b = JSON.parse(localStorage.getItem(LS_BAK) || "[]"); return Array.isArray(b) ? b.filter(x => x && x.day && x.data && x.data.meta) : []; } catch(_){ return []; } }
function rotateBackups(o){          // Stand beim ersten Öffnen des Tages aufheben (2 Generationen)
  try {
    const today = todayStr(), b = readBackups();
    if (b[0] && b[0].day === today) return;
    b.unshift({ day: today, data: o }); b.length = Math.min(b.length, 2);
    localStorage.setItem(LS_BAK, JSON.stringify(b));

}
async function flush(){
  if (fatal) return;
  if (saving){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); return; }
  if (!dirty.size) return;
  saving = true;
  const keys = [...dirty]; dirty.clear();
  try {
    if (store.kind === "local"){
      try { localStorage.setItem(LS_KEY, JSON.stringify({ meta:S.meta, tx:S.tx })); } catch(_){ throw { code:"local" }; }
    } else {
      for (const k of keys){
        if (k === "meta") await store.metaRef.set(clone(S.meta));
        else if (S.tx[k] && S.tx[k].length) await store.txCol.doc(k).set({ items: clone(S.tx[k]) });
        else { delete S.tx[k]; await store.txCol.doc(k).delete(); }
      }
    }
    setSync("ok");
  } catch(e){
    keys.forEach(k => dirty.add(k));
    const code = e && e.code;
    if (code === "invalid_argument" || code === "quota_exceeded" || code === "revoked" || code === "not_granted"){
      fatal = true; setSync("err", code === "quota_exceeded" ? "Сховище заповнене. Експортуйте резервну копію." : "Не вдалося зберегти зміни (немає прав на запис).");
    } else { setSync("err", "Немає зв'язку, повторюю…"); saveTimer = setTimeout(flush, 3000); }

}

}

const dueLabel = m => MSHORT[+m.slice(5,7)-1] + " " + m.slice(0,4);
function targetHint(c, p){
  if (c.pay) return p.debt ? "Борг " + eur(p.debt) + (p.under > 0 ? " · зарезервувати ще " + eur(p.under) : p.paid ? " · сплачено " + eur(p.paid) : "") : "Боргу немає ✓";
  const tg = c.target; if (!tg || !tg.amt) return "";
  const pct = " · " + Math.round((p.prog || 0) * 100) + "%";
  if (tg.type === "monthly") return (tg.refill ? "До " : "Ціль ") + eur(tg.amt) + "/міс." + (p.under > 0 ? " · ще " + eur(p.under) : " ✓");
  if (tg.type === "balance") return "Ціль " + eur(tg.amt) + pct;
  return eur(tg.amt) + " до " + dueLabel(p.due || tg.month) + (p.under > 0 ? " · ще " + eur(p.under) : pct);
}
/* Balken: bei Sparzielen und Schulden der Fortschritt, sonst der Rest des Monatsgeldes */
function rowBar(c, p){
  const tg = c.target, goal = c.pay ? p.debt > 0 : !!(tg && tg.amt && (tg.type === "date" || tg.type === "balance"));
  const bar = (f, cls) => '<div class="pb ' + cls + '"><i style="width:' + Math.round(f * 100) + '%"></i></div>';
  if (p.available < 0) return bar(1, "neg");
  if (goal && p.prog != null) return bar(p.prog, p.under > 0 ? "warn" : "");
  const base = p.start + p.assigned;
  if (base > 0){ const f = clamp01(p.available / base); return bar(f, f < .25 ? "warn" : ""); }
  return "";
}

/* ---------- Berichte: Daten ---------- */
const REP = { parts:[], payees:[] };       // Daten der gerade gezeigten Diagramme (für Tooltips und Klicks)
const VZ = {};                             // Konfigurationen der interaktiven SVG-Diagramme (Fadenkreuz/Tooltip)
let vzHiders = [], vzLastW = 0;
const NF0 = new Intl.NumberFormat("uk-UA", { maximumFractionDigits:0 }), NF1 = new Intl.NumberFormat("uk-UA", { maximumFractionDigits:1 });
const nsp = s => s.replace(/[\u00a0\u202f]/g, " ");
const eur0 = c => (c < 0 ? "−" : "") + nsp(NF0.format(Math.abs(Math.round(c / 100)))) + " €";
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many; };
const capMonth = m => { const s = MONTHS[+m.slice(5, 7) - 1]; return s[0].toUpperCase() + s.slice(1); };
function repData(m){
  const pm = addMonth(m, -1), months = [];
  for (let k = 5; k >= 0; k--) months.push(addMonth(m, -k));
  const pay = {}; allCats().forEach(c => { if (c.pay) pay[c.id] = 1; });
  const debtAcc = {}; S.meta.accounts.forEach(a => { if (a.payCat && catById(a.payCat)) debtAcc[a.id] = 1; });
  const inc = {}, sp = {}, byCat = {}, payee = {}, daily = {}, dailyPrev = {};
  let first = null;
  for (const t of allTx()){
    if (t.to || t.sys) continue;
    const tm = t.date.slice(0, 7);
    if (!first || tm < first) first = tm;
    if (t.cat === "rta"){ if (!debtAcc[t.acc]) inc[tm] = (inc[tm] || 0) + t.amt; continue; }
    if (!t.cat || pay[t.cat]) continue;
    sp[tm] = (sp[tm] || 0) - t.amt;                                   // Ausgaben positiv; Erstattungen mindern sie
    const bc = byCat[tm] = byCat[tm] || {}; bc[t.cat] = (bc[t.cat] || 0) - t.amt;
    if (tm === m || tm === pm){ const o = tm === m ? daily : dailyPrev, d = +t.date.slice(8, 10); o[d] = (o[d] || 0) - t.amt; }
    if (tm === m && t.amt < 0 && t.payee){ const p = payee[t.payee] = payee[t.payee] || { sum:0, n:0 }; p.sum -= t.amt; p.n++; }
  }
  return { m, pm, months, inc, sp, byCat, payee, daily, dailyPrev, first };
}
/* Schulden: Verlauf und Prognose bis zur Tilgung (Auto-Zahlung, sonst Monatsplan bzw. Zieldatum der Tilgungskategorie) */
function debtForecast(){
  const all = S.meta.accounts.filter(a => a.payCat && catById(a.payCat)), accs = all.filter(a => !a.closed);   // geschlossene (getilgte) Schulden zählen nur im Verlauf mit
  if (!accs.length) return null;
  const now = curMonth(), P = compute(now).per, K = { weekly:52/12, biweekly:26/12, monthly:1, quarterly:1/3, yearly:1/12 };
  const ix = {}; all.forEach((a, i) => { ix[a.id] = i; });
  const hist = all.map(() => ({})), paid = all.map(() => 0); let first = now;
  for (const t of allTx()){
    const tm = t.date.slice(0, 7);
    if (t.acc in ix){ const h = hist[ix[t.acc]]; h[tm] = (h[tm] || 0) + t.amt; if (tm < first) first = tm; if (t.to) paid[ix[t.acc]] += t.amt; }

/* Tooltip-Inhalt nur über DOM-API (Namen sind Nutzerdaten): Wert zuerst, Name danach, Linie als Schlüssel */
function fillTip(tip, t){
  tip.textContent = "";
  const h = document.createElement("div"); h.className = "vz-tt"; h.textContent = t.title; tip.appendChild(h);
  t.rows.forEach(r => {
    const row = document.createElement("div"); row.className = "vz-tr";
    const k = document.createElement("i"); if (r.color) k.style.background = r.color; row.appendChild(k);
    const v = document.createElement("b"); v.textContent = r.value; row.appendChild(v);

const focusVis = el => { try { return el.matches(":focus-visible"); } catch (e) { return false; } };   // ältere Browser kennen den Selektor nicht
/* Fadenkreuz (Linien) bzw. Spalten-Hervorhebung (Säulen) + Tooltip; Maus, Finger und Pfeiltasten */
function vzBind(root){
  root.querySelectorAll("[data-vz]").forEach(el => {
    const cfg = VZ[el.dataset.vz]; if (!cfg || el.vzBound) return; el.vzBound = true;
    const svg = el.querySelector("svg"), tip = el.querySelector(".vz-tip"), cross = svg.querySelector(".vz-cross"), band = svg.querySelector(".vz-band"), dots = [...svg.querySelectorAll(".vz-dot")];
    let cur = -1;
    const show = i => {
      i = Math.max(0, Math.min(cfg.n - 1, i)); cur = i;
      const k = el.clientWidth / cfg.W, x = cfg.x(i);
      if (cross){ cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.style.display = ""; }
      if (band){ band.setAttribute("x", cfg.bx(i)); band.style.display = ""; }
      dots.forEach(d => { const y = cfg.series[+d.dataset.s].y(i); if (y == null) d.style.display = "none"; else { d.style.display = ""; d.setAttribute("cx", x); d.setAttribute("cy", y); } });
      fillTip(tip, cfg.tip(i)); tip.hidden = false;
      const tw = tip.offsetWidth, full = el.clientWidth; let left = x * k + 12, top = 2;
      if (left + tw > full) left = x * k - 12 - tw;
      if (left < 0){ left = Math.max(0, Math.min(full - tw, x * k - tw / 2)); top = -tip.offsetHeight - 6; }
      tip.style.left = left + "px"; tip.style.top = top + "px";
    };
    const hide = () => { cur = -1; tip.hidden = true; if (cross) cross.style.display = "none"; if (band) band.style.display = "none"; dots.forEach(d => { d.style.display = "none"; }); };
    const at = e => { const r = svg.getBoundingClientRect(); return cfg.idx((e.clientX - r.left) * (cfg.W / r.width)); };
    el.addEventListener("pointerdown", e => show(at(e)));
    el.addEventListener("pointermove", e => { if (e.pointerType !== "touch" || e.buttons || cur >= 0) show(at(e)); });
    el.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
    el.addEventListener("focus", () => { if (cur < 0 && focusVis(el)) show(cfg.start != null ? cfg.start : cfg.n - 1); });
    el.addEventListener("blur", hide);
    el.addEventListener("keydown", e => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight"){ show(cur < 0 ? (cfg.start != null ? cfg.start : cfg.n - 1) : cur + (e.key === "ArrowLeft" ? -1 : 1)); e.preventDefault(); }
      else if (e.key === "Escape") hide();
    });
    vzHiders.push(hide);
  });
}
/* Segmentleiste (Aufteilung nach Gruppen): Tooltip je Segment, die übrigen treten zurück */
function partBind(root){
  root.querySelectorAll(".pt-wrap").forEach(w => {
    const tip = w.querySelector(".vz-tip"), bar = w.querySelector(".pt"), segs = [...bar.children], parts = REP.parts;
    const show = i => {
      segs.forEach((sg, j) => { sg.style.opacity = j === i ? 1 : .35; });
      fillTip(tip, { title: parts[i].name, rows: [{ color: parts[i].color, value: eur(parts[i].value), name: parts[i].share + " % витрат" }] }); tip.hidden = false;
      const r = segs[i].getBoundingClientRect(), wr = w.getBoundingClientRect();
      tip.style.left = Math.max(0, Math.min(wr.width - tip.offsetWidth, r.left - wr.left + r.width / 2 - tip.offsetWidth / 2)) + "px"; tip.style.top = (-tip.offsetHeight - 4) + "px";
    };
    const hide = () => { segs.forEach(sg => { sg.style.opacity = 1; }); tip.hidden = true; };
    segs.forEach((sg, i) => {
      sg.tabIndex = 0; sg.setAttribute("role", "img"); sg.setAttribute("aria-label", parts[i].name + ": " + eur(parts[i].value) + ", " + parts[i].share + " %");
      sg.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") show(i); });
      sg.addEventListener("pointerdown", () => show(i));
      sg.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") hide(); });
      sg.addEventListener("focus", () => { if (focusVis(sg)) show(i); });
      sg.addEventListener("blur", hide);
    });
    vzHiders.push(hide);
  });
}

      const a = parseAmt(q(el,"#mAmt").value), from = q(el,"#mFrom").value, to = q(el,"#mTo").value;
      if (!a || isNaN(a) || a <= 0) return toast("Введіть суму");
      if (from === to) return toast("Виберіть різні категорії");
      const get = id => (S.meta.assigned[S.month] || {})[id] || 0, nm = id => id === "rta" ? "Готово до розподілу" : (catById(id) || {}).name || "";
      if (from !== "rta") setAssigned(S.month, from, get(from) - a);
      if (to !== "rta") setAssigned(S.month, to, get(to) + a);
      note("Переміщено " + eur(a) + ": " + nm(from) + " → " + nm(to));
      closeSheet(); refresh(); toast("Переміщено " + eur(a));
    };
  });
}

   Bottom-Sheets

let sheetEl = null;
function openSheet(title, html, onMount){
  $("toast").classList.remove("low");
  closeSheet();
  sheetEl = document.createElement("div"); sheetEl.className = "ov";
  sheetEl.innerHTML = '<div class="sheet" role="dialog"><div class="hd"><b>' + esc(title) + '</b><button class="mini" data-x>✕</button></div>' + html + '</div>';
  sheetEl.addEventListener("click", e => { if (e.target === sheetEl || e.target.closest("[data-x]")) closeSheet(); });
  document.body.appendChild(sheetEl);
  if (onMount) onMount(sheetEl.querySelector(".sheet"));
}
function closeSheet(){ if (sheetEl){ sheetEl.remove(); sheetEl = null; } }
function confirmSheet(text, okLabel, fn){
  openSheet("Підтвердження", '<p>' + esc(text) + '</p><div class="row"><button class="btn sec" data-x>Скасувати</button><button class="btn danger" id="cOk">' + esc(okLabel) + '</button></div>',
    el => el.querySelector("#cOk").onclick = () => { closeSheet(); fn(); });
}
const q = (el, s) => el.querySelector(s);
function segBind(el, onChange){ el.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; [...el.children].forEach(x => x.classList.toggle("on", x === b)); onChange(b.dataset.v); }); }
function catOptions(sel, withRta){
  let h = withRta ? '<option value="rta"' + (sel === "rta" ? " selected" : "") + '>💰 Готово до розподілу</option>' : '<option value="">— виберіть категорію —</option>';
  S.meta.groups.forEach(g => {
    const cs = g.cats.filter(c => !c.hidden || c.id === sel); if (!cs.length) return;
    h += '<optgroup label="' + esc(g.name) + '">' + cs.map(c => '<option value="' + c.id + '"' + (c.id === sel ? " selected" : "") + '>' + esc(c.name) + '</option>').join("") + '</optgroup>';
  });
  return h;
}
function accOptions(sel, filter){ return S.meta.accounts.filter(a => (!a.closed && (!filter || filter(a))) || a.id === sel).map(a => '<option value="' + a.id + '"' + (a.id === sel ? " selected" : "") + '>' + esc(a.name) + '</option>').join(""); }

/* ---------- Transaktion erfassen/bearbeiten ---------- */
function sysTxSheet(t){          // Anfangsschuld / Schuldenkorrektur: nur Betrag und Datum
  const start = t.sys === "start";
  openSheet(start ? "Початковий борг" : "Коригування боргу", `
    <div class="f"><label>${start ? "Сума боргу, €" : "Зміна боргу, € (з мінусом: борг зменшився)"}</label><input class="amtin num" id="yAmt" type="text" inputmode="${start ? "decimal" : "text"}" value="${amtStr(-t.amt)}"></div>
    <div class="f"><label>Дата</label><input type="date" id="yDate" value="${t.date}"></div>
    <button class="btn wide" id="ySave">Зберегти</button>
    <button class="btn danger wide" style="margin-top:8px" id="yDel">Видалити</button>`, el => {
    q(el,"#ySave").onclick = () => {
      const a = parseAmt(q(el,"#yAmt").value); if (isNaN(a) || !a) return toast("Введіть суму");
      t.amt = -a; t.date = q(el,"#yDate").value || t.date; putTx(t); note("Змінено: " + (start ? "початковий борг " : "коригування боргу ") + eur(a)); closeSheet(); refresh(); toast("Збережено");
    };
    q(el,"#yDel").onclick = () => confirmSheet("Видалити цей запис?", "Видалити", () => { delTx(t.id); refresh(); toast("Видалено"); });
  });
}
function txSheet(id, preset, schedId){
  const openAccs = S.meta.accounts.filter(a => !a.closed);
  if (!openAccs.length){ toast("Спочатку додайте рахунок"); S.tab = "acc"; refresh(); return addAccSheet(); }
  const sc = schedId ? S.meta.sched.find(x => x.id === schedId) : null;
  if (schedId && !sc) return;
  const found = id ? findTx(id) : null; if (id && !found) return;
  const t = found ? clone(found.t) : null;
  if (t && t.sys && !t.cat && !t.to) return sysTxSheet(t);
  const src = t || (sc ? { amt:sc.amt, acc:sc.acc, to:sc.to, cat:sc.cat, payee:sc.payee || "", memo:sc.memo || "", date:sc.next } : null);
  const isNew = !src;
  let kind = src ? (src.to ? "xfer" : src.amt > 0 ? "in" : "out") : (preset && preset.kind) || "out";
  const isDebt = a => !!(a && a.payCat && catById(a.payCat));
  const cash = openAccs.find(a => !isDebt(a)) || openAccs[0];
  const lastAcc = S.lastAcc && accById(S.lastAcc) && !accById(S.lastAcc).closed ? S.lastAcc : cash.id;
  const v = src || Object.assign({ date: todayStr(), acc: lastAcc, cat: "", payee:"", memo:"", amt:0 }, preset || {});
  if (isNew && v.to && (v.acc === v.to || isDebt(accById(v.acc)))) v.acc = (openAccs.find(a => a.id !== v.to && !isDebt(a)) || openAccs.find(a => a.id !== v.to) || cash).id;
  const payMode = !!(isNew && preset && preset.pay && isDebt(accById(v.to)));      // vereinfachtes Formular „Zahlung auf eine Schuld“
  if (payMode && !openAccs.some(x => !isDebt(x))){ toast("Спочатку додайте рахунок, з якого платите"); return addAccSheet(); }
  // häufige Empfänger und Kategorien der letzten Monate als Schnellauswahl
  const since = addDays(todayStr(), -120), pc = {}, cc = {};
  for (const x of allTx()){
    if (x.to || x.sys || x.date < since) continue;
    if (x.payee){ const o = pc[x.payee] = pc[x.payee] || { n:0, out:0 }; o.n++; o.out += x.amt < 0 ? 1 : -1; }
    if (x.cat && x.cat !== "rta" && x.amt < 0) cc[x.cat] = (cc[x.cat] || 0) + 1;
  }
  const payeeTop = out => Object.keys(pc).filter(p => (pc[p].out >= 0) === out).sort((a, b) => pc[b].n - pc[a].n).slice(0, 6);
  const topCats = allCats().filter(c => !c.hidden && !c.pay).sort((a, b) => (cc[b.id] || 0) - (cc[a.id] || 0)).slice(0, 8);
  const payees = [...new Set(allTx().map(x => x.payee).filter(Boolean))].slice(-200);
  const today = todayStr(), yest = addDays(today, -1);
  openSheet(sc ? "Регулярний платіж" : t ? "Редагувати транзакцію" : payMode ? "Платіж за боргом" : "Нова транзакція", `
    <div class="seg" id="tKind"><button data-v="out">Витрата</button><button data-v="in">Дохід</button><button data-v="xfer">Переказ</button></div>
    <div class="f"><input class="amtin num" id="tAmt" type="text" inputmode="decimal" placeholder="0,00 €" value="${amtStr(Math.abs(v.amt))}"></div>
    <div id="fPayee"><div class="qrow" id="tPayees"></div>
      <div class="f"><label>Одержувач / платник</label><input type="text" id="tPayee" list="payeeList" value="${esc(v.payee)}" maxlength="60" autocomplete="off">
      <datalist id="payeeList">${payees.map(p => '<option value="' + esc(p) + '">').join("")}</datalist></div></div>
    <div class="f" id="fCat"><label>Категорія</label><div class="qrow" id="tCats"></div><select id="tCat"></select><div class="info" id="tInfo"></div></div>
    <div class="row"><div class="f"><label id="lAcc">Рахунок</label><select id="tAcc">${accOptions(v.acc, payMode ? (a => !isDebt(a)) : null)}</select></div>
      <div class="f" id="fTo"><label>На рахунок</label><select id="tTo">${accOptions(v.to || "")}</select></div></div>
    <div class="info" id="tHint"></div>
    <div class="f"><label>${sc ? "Наступна дата" : "Дата"}</label><div class="row" style="align-items:center"><input type="date" id="tDate" value="${v.date}">${sc ? "" : '<div class="qrow" style="flex:none;margin:0;flex-wrap:nowrap"><button data-d="' + today + '">Сьогодні</button><button data-d="' + yest + '">Вчора</button></div>'}</div></div>
    <div class="row"><div class="f"><label>Нотатка</label><input type="text" id="tMemo" value="${esc(v.memo)}" maxlength="80"></div>
      ${t ? "" : '<div class="f"><label>Повторювати</label><select id="tRep">' + (sc ? "" : '<option value="">Ні</option>') + Object.entries(FREQ).map(([k, l]) => '<option value="' + k + '"' + (sc && sc.freq === k ? " selected" : "") + '>' + l + '</option>').join("") + '</select></div>'}</div>
    <button class="btn wide" id="tSave">Зберегти</button>
    ${isNew ? '<button class="btn sec wide" style="margin-top:8px" id="tAgain">Зберегти і додати ще</button>' : '<button class="btn danger wide" style="margin-top:8px" id="tDel">Видалити</button>'}`, el => {
    const catSel = q(el,"#tCat"), accSel = q(el,"#tAcc"), toSel = q(el,"#tTo"), repSel = q(el,"#tRep");
    const info = () => {
      const box = q(el,"#tInfo"), hint = q(el,"#tHint"); box.textContent = ""; box.className = "info"; hint.textContent = "";
      const a = parseAmt(q(el,"#tAmt").value) || 0, acc = accById(accSel.value), c = catById(catSel.value), date = q(el,"#tDate").value || today;
      if (kind === "out" && c){
        if (c.pay) box.textContent = "Буде записано як платіж за боргом (переказ на «" + ((accById(c.pay)||{}).name || "") + "»).";
        else {
          const m = date.slice(0, 7), p = compute(m).per[c.id];
          const base = p.available - (t && !t.to && t.cat === c.id && t.date.slice(0, 7) === m ? t.amt : 0);   // beim Bearbeiten den alten Betrag herausrechnen
          box.textContent = "Доступно: " + eur(base) + (a ? " → залишиться " + eur(base - a) : "");
          if (base - a < 0) box.className = "info neg";
        }
      }
      if (kind === "out" && acc && acc.payCat && !(c && c.pay)) hint.textContent = "Покупка в борг: цю суму буде зарезервовано з категорії на погашення «" + acc.name + "».";
      if (kind === "xfer"){
        const d = accById(toSel.value);
        if (isDebt(d)){
          if (isNew){
            const p = compute(date.slice(0, 7)).per[d.payCat], owed = Math.max(0, -accBalance(d.id)), have = Math.max(0, p.available), short = Math.max(0, a - have);
            hint.textContent = "«" + d.name + "»: борг " + eur(owed) + (a ? " → після платежу " + eur(Math.max(0, owed - a)) : "") + ". " +
              (a && short > 0 ? (have > 0 ? "Зарезервовано " + eur(have) + ", решту " + eur(short) : eur(short)) + " буде взято з «Готово до розподілу»." : "Зарезервовано на цей борг: " + eur(have) + ".");
          } else hint.textContent = "Платіж за боргом «" + d.name + "».";
        }
      }
      q(el,"#tSave").textContent = !t && repSel && repSel.value && date > today ? "Запланувати" : payMode ? "Записати платіж" : "Зберегти";
    };
    const paintCats = () => { el.querySelectorAll("#tCats button").forEach(b => b.classList.toggle("on", b.dataset.c === catSel.value)); info(); };
    const setKind = k => {
      kind = k; [...q(el,"#tKind").children].forEach(b => b.classList.toggle("on", b.dataset.v === k));
      q(el,"#fPayee").hidden = k === "xfer"; q(el,"#fCat").hidden = k === "xfer"; q(el,"#fTo").hidden = k !== "xfer" || payMode;
      q(el,"#lAcc").textContent = k === "xfer" ? "З рахунку" : "Рахунок";
      const cur = catSel.value || v.cat;
      catSel.innerHTML = catOptions(k === "in" ? (cur || "rta") : (cur === "rta" ? "" : cur), k === "in");
      q(el,"#tCats").innerHTML = k === "out" ? topCats.map(c => '<button data-c="' + c.id + '">' + catIcon(c) + " " + esc(c.name) + '</button>').join("") : "";
      q(el,"#tPayees").innerHTML = k === "xfer" ? "" : payeeTop(k === "out").map(p => '<button data-p="' + esc(p) + '">' + esc(p) + '</button>').join("");
      if (k === "xfer" && toSel.value === accSel.value){ const o = [...toSel.options].find(o => o.value !== accSel.value); if (o) toSel.value = o.value; }
      paintCats();
    };
    const applyPayee = () => { const c = S.meta.payeeCat[q(el,"#tPayee").value.trim()]; if (c && kind !== "xfer" && (kind === "in" || c !== "rta") && (catById(c) || c === "rta")) catSel.value = c; paintCats(); };
    if (payMode){ q(el,"#tKind").hidden = true; q(el,"#tAgain").hidden = true; }
    if (isNew && preset && preset.rep) repSel.value = preset.rep;
    segBind(q(el,"#tKind"), setKind); setKind(kind);
    if (isNew && preset && preset.cat){ catSel.value = preset.cat; paintCats(); }
    q(el,"#tCats").onclick = e => { const b = e.target.closest("button"); if (!b) return; catSel.value = b.dataset.c; paintCats(); };
    q(el,"#tPayees").onclick = e => { const b = e.target.closest("button"); if (!b) return; q(el,"#tPayee").value = b.dataset.p; applyPayee(); };
    q(el,"#tPayee").addEventListener("change", applyPayee);
    catSel.onchange = paintCats; accSel.onchange = info; toSel.onchange = info; if (repSel) repSel.onchange = info;
    q(el,"#tAmt").addEventListener("input", info); q(el,"#tDate").addEventListener("change", info);
    el.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { q(el,"#tDate").value = b.dataset.d; info(); });
    if (isNew && !(payMode && v.amt)) setTimeout(() => q(el,"#tAmt").focus(), 50);
    const doSave = again => {
      const a = parseAmt(q(el,"#tAmt").value);
      if (!a || isNaN(a) || a <= 0) return toast("Введіть суму");
      const date = q(el,"#tDate").value || today;
      const n = { acc: accSel.value, memo: q(el,"#tMemo").value.trim() };
      if (kind === "xfer"){
        n.to = toSel.value; if (n.to === n.acc) return toast("Виберіть різні рахунки");
        n.amt = -a; n.cat = null; n.payee = "";
      } else {
        n.cat = catSel.value || null; n.payee = q(el,"#tPayee").value.trim();
        if (kind === "out" && !n.cat) return toast("Виберіть категорію");
        n.amt = kind === "out" ? -a : a;
        const pcat = kind === "out" ? catById(n.cat) : null;
        if (pcat && pcat.pay && accById(pcat.pay)){          // Ausgabe in der Tilgungskategorie = Zahlung an das Schuldenkonto
          if (pcat.pay === n.acc) return toast("Виберіть рахунок, з якого платите");
          n.to = pcat.pay; n.cat = null; n.payee = "";
        }
      }
      const toDebt = n.to && isDebt(accById(n.to)) ? accById(n.to) : null;
      const what = toDebt ? "Платіж за боргом " + eur(a) + " · " + toDebt.name : n.to ? "Переказ " + eur(a) : (n.amt < 0 ? "Витрата " : "Дохід ") + eur(a) + (n.payee ? " · " + n.payee : "");
      const rep = repSel ? repSel.value : "";
      if (sc){
        const cur = S.meta.sched.find(x => x.id === sc.id); if (!cur){ closeSheet(); return refresh(); }
        Object.assign(cur, { amt:n.amt, acc:n.acc, cat:n.cat, payee:n.payee, memo:n.memo, freq:rep || cur.freq, next:date, day:+date.slice(8, 10) });
        if (n.to) cur.to = n.to; else delete cur.to;
        markDirty("meta"); note("Змінено регулярний платіж: " + what); closeSheet(); refresh(); return toast("Збережено");
      }
      if (!isDebt(accById(n.acc))) S.lastAcc = n.acc;
      if (isNew && rep){
        const s = { id:rid(), amt:n.amt, acc:n.acc, cat:n.cat, payee:n.payee, memo:n.memo, freq:rep, next:date, day:+date.slice(8, 10) };
        if (n.to) s.to = n.to;
        S.meta.sched.push(s); markDirty("meta"); note("Регулярний платіж: " + what); closeSheet(); refresh();
        return toast(date <= today ? "Записано, повтор заплановано" : "Заплановано на " + shortDate(date));
      }
      n.id = t ? t.id : rid(); n.ts = t ? t.ts : Date.now(); n.date = date;
      if (t && t.sys) n.sys = t.sys;
      if (t && t.sched) n.sched = t.sched;
      putTx(n);
      if (isNew && toDebt) coverDebtPayment(n);
      note((t ? "Змінено: " : "") + what);
      closeSheet(); refresh(); toast(t ? "Збережено" : toDebt ? "Платіж записано: " + eur(a) : "Додано " + eur(a));
      if (again) txSheet(null, { kind, acc:n.acc, date });
    };
    q(el,"#tSave").onclick = () => doSave(false);
    if (isNew) q(el,"#tAgain").onclick = () => doSave(true);
    else q(el,"#tDel").onclick = () => sc
      ? confirmSheet("Видалити цей регулярний платіж? Уже записані транзакції залишаться.", "Видалити", () => { S.meta.sched = S.meta.sched.filter(x => x.id !== sc.id); markDirty("meta"); note("Видалено регулярний платіж: " + (sc.to ? "переказ" : sc.payee || (catById(sc.cat)||{}).name || "платіж") + " " + eur(Math.abs(sc.amt))); refresh(); toast("Видалено"); })
      : confirmSheet("Видалити цю транзакцію?", "Видалити", () => { delTx(t.id); note("Видалено: " + (t.to ? "переказ" : t.payee || (catById(t.cat)||{}).name || "транзакцію") + " " + eur(Math.abs(t.amt))); refresh(); toast("Видалено"); });
  });
}
function schedSheet(){
  const list = S.meta.sched.filter(s => s.next && FREQ[s.freq]).sort((a, b) => a.next < b.next ? -1 : 1);
  openSheet("Регулярні платежі", (list.length
      ? '<div class="list" style="margin-bottom:12px">' + list.map(s => schedRow(s, 'data-sid="' + s.id + '"')).join("") + '</div>'
      : '<p class="muted" style="margin-top:0">Оренда, зарплата, підписки: додайте їх один раз, і програма сама запише транзакцію в потрібний день.</p>') +
    '<button class="btn wide" id="scAdd">＋ Новий регулярний платіж</button>', el => {
    q(el,"#scAdd").onclick = () => txSheet(null, { rep:"monthly" });
    el.querySelectorAll("[data-sid]").forEach(r => r.onclick = () => txSheet(null, null, r.dataset.sid));

/* ---------- Kategorie ---------- */
function payDebt(accId, rep){
  const a = accById(accId); if (!a) return;
  const cat = catById(a.payCat), tg = cat && cat.target, p = compute(curMonth()).per[a.payCat], owed = Math.max(0, -accBalance(accId));
  const plan = tg && tg.type === "monthly" && tg.amt ? Math.min(owed, tg.amt) : 0;
  const sug = rep ? plan : p && p.available > 0 ? Math.min(owed, p.available) : plan;
  txSheet(null, { kind:"xfer", to:accId, amt:-sug, pay:true, rep: rep || "" });
}
const debtSched = accId => S.meta.sched.find(s => s.to === accId && s.next && FREQ[s.freq]);
function catSheet(catId){
  const c = catById(catId); if (!c) return;
  const C = compute(S.month), p = C.per[catId];
  const prev = compute(addMonth(S.month, -1)).per[catId];
  const tg = c.target || {}, pay = !!(c.pay && accById(c.pay)), auto = pay ? debtSched(c.pay) : null;
  const chips = [];
  if (p.under > 0) chips.push([pay ? "За планом" : "Для цілі", p.assigned + p.under]);
  if (prev.assigned && prev.assigned !== p.assigned) chips.push(["Як минулого місяця", prev.assigned]);
  if (!pay && prev.activity < 0) chips.push(["Витрачено минулого місяця", -prev.activity]);
  if (p.available < 0) chips.push(["Покрити перевитрату", p.assigned - p.available]);
  if (C.rta > 0) chips.push(["+ увесь залишок", p.assigned + C.rta]);
  if (p.assigned) chips.push([pay ? "Прибрати резерв" : "Прибрати розподіл", 0]);
  const types = pay ? [["","Немає"],["monthly","Щомісяця"],["date","Погасити до"]] : [["","Немає"],["monthly","Щомісяця"],["date","До дати"],["balance","Накопичити"]];
  const mon = MONTHS_LOC[+S.month.slice(5,7)-1] + " " + S.month.slice(0,4);
  openSheet(catIcon(c) + " " + c.name, `
    <div class="stats num">${pay
      ? '<div><small>Борг</small><b style="color:' + (p.debt ? "var(--neg)" : "var(--pos)") + '">' + eur(p.debt) + '</b></div><div><small>Сплачено за місяць</small>' + eur(p.paid || 0) + '</div><div><small>Зарезервовано</small><b>' + eur(p.available) + '</b></div>'
      : '<div><small>На початок</small>' + eur(p.start) + '</div><div><small>Витрачено</small>' + eur(p.activity) + '</div><div><small>Доступно</small><b style="color:' + (p.available < 0 ? "var(--neg)" : "var(--pos)") + '">' + eur(p.available) + '</b></div>'}</div>

function moveSheet(catId){
  const c = catById(catId), C = compute(S.month), p = C.per[catId];
  openSheet("Перемістити гроші", `
    <div class="seg" id="mDir"><button data-v="from" class="on">З «${esc(c.name)}»</button><button data-v="to">У «${esc(c.name)}»</button></div>
    <div class="f"><label>Сума, €</label><input type="text" id="mAmt" class="amtin num" inputmode="decimal" value="${p.available > 0 ? amtStr(p.available) : p.available < 0 ? amtStr(-p.available) : ""}"></div>
    <div class="f"><label id="mOtherL">Куди</label><select id="mOther"><option value="rta">💰 Готово до розподілу</option>${catOptions("", false).replace('<option value="">— виберіть категорію —</option>', "")}</select></div>
    <button class="btn wide" id="mGo">Перемістити</button>`, el => {
    let dir = "from";
    segBind(q(el,"#mDir"), v => { dir = v; q(el,"#mOtherL").textContent = v === "from" ? "Куди" : "Звідки"; });
    q(el,"#mGo").onclick = () => {
      const a = parseAmt(q(el,"#mAmt").value), other = q(el,"#mOther").value;
      if (!a || isNaN(a) || a <= 0) return toast("Введіть суму");
      if (other === catId) return toast("Виберіть іншу категорію");
      const asg = S.meta.assigned[S.month] || {};
      const delta = dir === "from" ? -a : a;
      setAssigned(S.month, catId, (asg[catId] || 0) + delta);
      if (other !== "rta") setAssigned(S.month, other, ((S.meta.assigned[S.month] || {})[other] || 0) - delta);
      note("Переміщено " + eur(a) + (dir === "from" ? " з «" : " у «") + c.name + "»");
      closeSheet(); refresh(); toast("Переміщено " + eur(a));
    };
  });
}
function editCatSheet(catId){
  const c = catById(catId); const g = S.meta.groups.find(g => g.cats.includes(c));
  const used = allTx().some(t => t.cat === catId) || Object.values(S.meta.assigned).some(a => a[catId]) || S.meta.sched.some(x => x.cat === catId);

  openSheet("Категорія", `
    <div class="f"><label>Іконка</label><div class="emojis" id="eIco">${EMOJIS.map(e => '<button data-e="' + e + '"' + (e === icon ? ' class="on"' : "") + '>' + e + '</button>').join("")}</div></div>

    <div class="f"><label>Група</label><select id="eGrp">${S.meta.groups.map(x => '<option value="' + x.id + '"' + (x === g ? " selected" : "") + '>' + esc(x.name) + '</option>').join("")}</select></div>

    ${locked ? '<p class="muted" style="font-size:12.5px">Ця категорія прив’язана до рахунку-боргу, тому видалити її не можна.</p>' : used ? '<p class="muted" style="font-size:12.5px">Категорія вже використовується. Під час видалення її транзакції й гроші буде перенесено в іншу категорію.</p>' : ""}`, el => {
    q(el,"#eIco").onclick = e => { const b = e.target.closest("button"); if (!b) return; icon = b.dataset.e; el.querySelectorAll("#eIco button").forEach(x => x.classList.toggle("on", x === b)); };
    q(el,"#eSave").onclick = () => {
      c.name = q(el,"#eName").value.trim() || c.name; c.icon = icon;
      const ng = S.meta.groups.find(x => x.id === q(el,"#eGrp").value);
      if (ng && ng !== g){ g.cats.splice(g.cats.indexOf(c), 1); ng.cats.push(c); }
      markDirty("meta"); note("Змінено категорію «" + c.name + "»"); closeSheet(); refresh();
    };
    q(el,"#eHide").onclick = () => { c.hidden = !c.hidden; markDirty("meta"); note((c.hidden ? "Приховано" : "Показано") + " категорію «" + c.name + "»"); closeSheet(); refresh(); toast(c.hidden ? "Категорію приховано" : "Категорію показано"); };
    if (!locked) q(el,"#eDel").onclick = () => {
      if (!used) return confirmSheet("Видалити категорію «" + c.name + "»?", "Видалити", () => { g.cats.splice(g.cats.indexOf(c), 1); markDirty("meta"); note("Видалено категорію «" + c.name + "»"); refresh(); toast("Категорію видалено"); });
      openSheet("Видалити «" + c.name + "»", '<div class="f"><label>Перенести транзакції та гроші в</label><select id="rTo">' + catOptions("", false).replace('<option value="">— виберіть категорію —</option>', "").replace('value="' + c.id + '"', 'value="' + c.id + '" disabled') + '</select></div><button class="btn danger wide" id="rGo">Перенести й видалити</button>', el2 => {
        q(el2,"#rGo").onclick = () => {
          const to = q(el2,"#rTo").value; if (!to || to === c.id) return toast("Виберіть категорію");
          for (const k in S.tx){ let ch = false; S.tx[k].forEach(t => { if (t.cat === c.id){ t.cat = to; ch = true; } }); if (ch) markDirty(k); }
          for (const m in S.meta.assigned){ const a = S.meta.assigned[m]; if (a[c.id]){ a[to] = (a[to] || 0) + a[c.id]; delete a[c.id]; } }
          for (const p in S.meta.payeeCat) if (S.meta.payeeCat[p] === c.id) S.meta.payeeCat[p] = to;
          S.meta.sched.forEach(x => { if (x.cat === c.id) x.cat = to; });
          g.cats.splice(g.cats.indexOf(c), 1); markDirty("meta"); note("Видалено категорію «" + c.name + "»"); closeSheet(); refresh(); toast("Категорію видалено");
        };
      });
    };
  });
}

    </div>
    <button class="btn wide" id="aOk">Додати</button>`, el => {

      const name = q(el,"#aName").value.trim(); if (!name) return toast("Введіть назву");

      let bal = q(el,"#aBal").value.trim() ? parseAmt(q(el,"#aBal").value) : 0; if (isNaN(bal)) return toast("Перевірте суму");
      bal = Math.abs(bal);

        if (plan === "monthly"){ const pa = parseAmt(q(el,"#aPlanAmt").value); if (!pa || isNaN(pa) || pa <= 0) return toast("Введіть щомісячну суму"); cat.target = { type:"monthly", amt:pa }; }
        if (plan === "date") cat.target = { type:"date", amt:1, month: q(el,"#aPlanMonth").value || addMonth(curMonth(), 3) };

const getDl = () => dlP || (dlP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null));
/* Datei speichern: in Claude über die Download-Funktion, auf dem iPhone über „Teilen“, sonst als normaler Download */
async function saveFile(name, data, mime){
  const dl = await getDl();
  if (dl){ try { await dl.save({ filename:name, data }); return true; } catch(e){ toast(e && e.code === "declined" ? "Скасовано" : "Не вдалося зберегти файл"); return false; } }
  try {
    const file = new File([data], name, { type: mime });
    if (window.matchMedia && matchMedia("(pointer:coarse)").matches && navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; }
  } catch(e){ if (e && e.name === "AbortError") return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: mime })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); return true;
}

/* ---------- Ziele automatisch füllen ---------- */
function autoAssign(){
  const C = compute(S.month); let left = C.rta, total = 0;
  for (const c of allCats()){
    if (c.hidden) continue;
    const p = C.per[c.id]; if (p.under <= 0 || left <= 0) continue;
    const add = Math.min(p.under, left);
    setAssigned(S.month, c.id, p.assigned + add); left -= add; total += add;
  }
  note("Розподілено за цілями: " + eur(total)); refresh(); toast("Розподілено " + eur(total));
}
function fillSheet(){
  const C = compute(S.month), prevA = S.meta.assigned[addMonth(S.month, -1)] || {}, curA = S.meta.assigned[S.month] || {};
  const vis = allCats().filter(c => !c.hidden), free = Math.max(0, C.rta);
  let under = 0, prevSum = 0, curSum = 0;
  vis.forEach(c => { under += C.per[c.id].under; if (!curA[c.id] && prevA[c.id] > 0) prevSum += prevA[c.id]; });
  for (const k in curA) curSum += curA[k];
  openSheet("Заповнити бюджет", `
    <div class="card" style="text-align:center"><div class="muted" style="font-size:12.5px">Готово до розподілу</div><div class="big num"${C.rta < 0 ? ' style="color:var(--neg)"' : ""}>${eur(C.rta)}</div></div>
    <button class="btn wide" id="fGoals"${under > 0 && free > 0 ? "" : " disabled"}>За цілями і планами боргів: ${eur(Math.min(under, free))}</button>
    <button class="btn sec wide" style="margin-top:8px" id="fPrev"${prevSum > 0 && free > 0 ? "" : " disabled"}>Як минулого місяця: ${eur(Math.min(prevSum, free))}</button>
    <button class="btn danger wide" style="margin-top:8px" id="fReset"${curSum ? "" : " disabled"}>Скинути розподіл цього місяця: ${eur(curSum)}</button>
    <p class="muted" style="font-size:12.5px;margin:12px 2px 0">${free > 0 ? "Розподіляється лише те, що є в «Готово до розподілу»." : "Зараз немає вільних грошей для розподілу: спершу запишіть дохід або звірте залишок рахунку."} Будь-яку дію можна скасувати кнопкою ↩︎ угорі.</p>`, el => {
    q(el,"#fGoals").onclick = () => { closeSheet(); autoAssign(); };
    q(el,"#fPrev").onclick = () => {
      let left = free, total = 0;
      for (const c of vis){ const a = prevA[c.id] || 0; if (curA[c.id] || a <= 0 || left <= 0) continue; const add = Math.min(a, left); setAssigned(S.month, c.id, add); left -= add; total += add; }
      note("Розподілено як минулого місяця: " + eur(total)); closeSheet(); refresh(); toast("Розподілено " + eur(total));
    };
    q(el,"#fReset").onclick = () => confirmSheet("Прибрати всі розподіли за " + monthLabel(S.month).toLowerCase() + "? Гроші повернуться в «Готово до розподілу».", "Скинути", () => {
      delete S.meta.assigned[S.month]; markDirty("meta"); note("Скинуто розподіл за " + monthLabel(S.month).toLowerCase()); refresh(); toast("Розподіл скинуто");
    });
  });
}

function nextStep(C){

    return tip("", "<b>Почніть із залишку.</b> Вкажіть, скільки грошей зараз на рахунку «" + esc(cashAccs[0].name) + "»: після цього їх можна розподіляти.", "openAcc", "Ввести", cashAccs[0].id);

    if (allCats().some(c => !c.hidden && C.per[c.id].available > 0)) return tip("neg", "<b>Розподілено на " + eur(-C.rta) + " більше, ніж є.</b> Заберіть цю суму з якоїсь категорії.", "fixRta", "Виправити");

function moveCat(id, dir){
  const flat = []; S.meta.groups.forEach(g => g.cats.forEach(c => flat.push([g, c])));
  const i = flat.findIndex(([, c]) => c.id === id); if (i < 0) return;
  const [g, c] = flat[i], idx = g.cats.indexOf(c);
  if (dir < 0){
    if (idx > 0) [g.cats[idx-1], g.cats[idx]] = [g.cats[idx], g.cats[idx-1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi > 0){ g.cats.splice(idx, 1); S.meta.groups[gi-1].cats.push(c); } }
  } else {
    if (idx < g.cats.length - 1) [g.cats[idx+1], g.cats[idx]] = [g.cats[idx], g.cats[idx+1]];
    else { const gi = S.meta.groups.indexOf(g); if (gi < S.meta.groups.length - 1){ g.cats.splice(idx, 1); S.meta.groups[gi+1].cats.unshift(c); } }
  }
  markDirty("meta"); note("Змінено порядок категорій"); refresh();
}
document.addEventListener("click", e => {

  switch (act){
    case "mPrev": S.month = addMonth(S.month, -1); refresh(); break;
    case "mNext": S.month = addMonth(S.month, 1); refresh(); break;
    case "settings": settingsSheet(); break;
    case "toggleGrp": S.collapsed[id] = !S.collapsed[id]; refresh(); break;
    case "toggleEdit": S.edit = !S.edit; refresh(); break;
    case "openCat": catSheet(id); break;
    case "editCat": editCatSheet(id); break;
    case "fill": fillSheet(); break;
    case "history": historySheet(); break;
    case "fixRta": moveAnySheet({ toRta:true, amt:-compute(S.month).rta }); break;
    case "backupNow": exportBackup(); break;
    case "backupLater": localInfo({ snooze: Date.now() + 3 * 864e5 }); refresh(); break;
    case "addCat": nameSheet("Нова категорія", "", v => { S.meta.groups.find(g => g.id === id).cats.push({ id:rid(), name:v }); markDirty("meta"); note("Нова категорія «" + v + "»"); refresh(); }); break;
    case "addGroup": nameSheet("Нова група", "", v => { S.meta.groups.push({ id:rid(), name:v, cats:[] }); markDirty("meta"); note("Нова група «" + v + "»"); refresh(); }); break;
    case "renameGroup": { const g = S.meta.groups.find(x => x.id === id);
      nameSheet("Група", g.name, v => { g.name = v; markDirty("meta"); note("Перейменовано групу «" + v + "»"); refresh(); },
        { label:"Видалити групу", fn: () => { if (g.cats.length) return toast("Спочатку перенесіть або видаліть категорії групи"); S.meta.groups.splice(S.meta.groups.indexOf(g), 1); markDirty("meta"); note("Видалено групу «" + g.name + "»"); refresh(); toast("Групу видалено"); } }); break; }
    case "grpUp": case "grpDown": { e.stopPropagation(); const gs = S.meta.groups, i = gs.findIndex(g => g.id === id), j = i + (act === "grpUp" ? -1 : 1);
      if (j >= 0 && j < gs.length){ [gs[i], gs[j]] = [gs[j], gs[i]]; markDirty("meta"); note("Змінено порядок груп"); refresh(); } break; }
    case "editTx": txSheet(id); break;
    case "clearCatFilter": S.catFilter = ""; refresh(); break;
    case "showUncat": S.catFilter = "__none"; S.tab = "tx"; refresh(); break;
    case "more": S.txLimit += 150; refresh(); break;
    case "openAcc": accSheet(id); break;
    case "addAcc": addAccSheet(); break;
    case "addTx": txSheet(null); break;
    case "xferTx": txSheet(null, { kind:"xfer" }); break;
    case "txAll": S.accFilter = ""; S.catFilter = ""; S.tab = "tx"; refresh(); break;
    case "moveAny": moveAnySheet(); break;
    case "sched": schedSheet(); break;
    case "editSched": txSheet(null, null, id); break;
    case "addDebt": addAccSheet("debt"); break;
    case "newGoal": goalSheet(); break;
    case "repTbl": S.repTbl = S.repTbl || {}; S.repTbl[id] = !S.repTbl[id]; refresh(); break;
    case "repAll": S.repAll = !S.repAll; refresh(); break;
    case "repCat": catTrendSheet(id); break;
    case "repPayee": { const name = REP.payees[+id]; if (name != null){ S.search = name; S.accFilter = ""; S.catFilter = ""; S.tab = "tx"; window.scrollTo(0, 0); refresh(); } break; }
  }
});
document.querySelectorAll(".nav button[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; if (S.tab !== "tx"){ S.catFilter = ""; } window.scrollTo(0, 0); refresh(); });
$("navAdd").onclick = () => txSheet(null, S.tab === "tx" && S.catFilter && S.catFilter !== "__none" ? { cat:S.catFilter } : S.tab === "tx" && S.accFilter ? { acc:S.accFilter } : null);
window.addEventListener("pagehide", () => { if (dirty.size) flush(); });
document.addEventListener("pointerdown", () => { for (const f of vzHiders) f(); }, true);      // Tipp woandershin schließt offene Diagramm-Tooltips
let vzRz; window.addEventListener("resize", () => { clearTimeout(vzRz); vzRz = setTimeout(() => { if (S.meta && S.tab === "rep" && !sheetEl && $("view").clientWidth !== vzLastW) renderRep(); }, 150); });
document.addEventListener("visibilitychange", () => { if (document.hidden && dirty.size) flush(); });

init();
})();
</script>
